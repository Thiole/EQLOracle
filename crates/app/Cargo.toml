[package]
name = "eqlp-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop shell: first-launch directory picker, live log tailing, real-time parse feed. Docked window only -- see FOUNDATION.md #4 for why there is no overlay yet."

[[bin]]
name = "eqlp-app"
path = "src/main.rs"

# `custom-protocol` is what actually decides devUrl-vs-frontendDist -- not
# the debug/release profile, a Cargo feature (see tauri's own build.rs).
# On by default: a plain `cargo run -p eqlp-app` (debug or release, no
# extra flags) should behave like the old static-file app always did --
# read `ui/dist` straight off disk, no dev server, no network -- rather
# than needing a flag nobody would remember to pass. `cargo tauri dev`
# (`npm run tauri -- dev`) still gets live-reload: the Tauri CLI already
# invokes cargo with `--no-default-features` for its own `dev` command
# (confirmed via `-v` output), which turns this back off in favor of
# `devUrl`. Needs `npm run build` in `ui/` to have produced `ui/dist`
# before this crate builds -- there's nothing to embed otherwise.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eqlp-core = { path = "../core" }
eqlp-source = { path = "../source" }
eqlp-session = { path = "../session" }
eqlp-store = { path = "../store" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# why: already in the lockfile as a transitive dep of tauri-plugin-updater
# itself -- promoted to a direct dep for endpoint parsing, same precedent
# as base64 above
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
# Already present in the lockfile as a transitive dep of tauri itself
# (confirmed: base64 0.22.1) -- promoted to a direct dependency here
# rather than duplicated, just to hand a custom notification sound's
# bytes to the frontend as a data: URL (see settings::custom_sound_data_
# url). No new dependency tree growth.
base64 = "0.22"
# Already present in the lockfile as a direct dep of eqlp-core (its own
# rule engine) -- promoted here too rather than hand-rolling parsers for
# spelldata's own messy duration/effect-text formats (see spelleffect.rs).
regex = "1"
