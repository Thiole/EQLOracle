[package]
name = "eqlp-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
eqlp-core = { path = "../crates/core" }
eqlp-source = { path = "../crates/source" }
eqlp-session = { path = "../crates/session" }

[[bin]]
name = "classify"
path = "fuzz_targets/classify.rs"
test = false
doc = false

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false

[[bin]]
name = "pack"
path = "fuzz_targets/pack.rs"
test = false
doc = false

[[bin]]
name = "session"
path = "fuzz_targets/session.rs"
test = false
doc = false

[workspace]
