[workspace]
resolver = "2"
members = ["crates/testkit", "crates/core", "crates/source", "crates/store", "crates/session", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Fuzzing and benching want debug assertions on but still fast.
[profile.bench]
inherits = "release"
debug = true
