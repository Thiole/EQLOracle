pattern = '''^You can no longer advance your skill from making this item\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You can no longer advance your skill from making this item."]

[[rule]]
id = "craft.destroyed"
kind = "craft"
priority = 50
anchors = ["You successfully destroyed "]
# why: item capture runs to end of line on purpose -- covers both a
# plain item and one with a trailing "+N" augment tier the same way.
pattern = '''^You successfully destroyed (?P<qty>[0-9]+) (?P<item>.+)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] You successfully destroyed 1 Guild Summons.",
  "[Tue Jul 28 15:02:15 2026] You successfully destroyed 1 Raw-Hide Wristbands +2.",
]
[rule.fields]
qty = { from = "qty", as = "u64" }
item = { from = "item", as = "str" }

[[rule]]
id = "craft.merged"
kind = "craft"
priority = 50
anchors = ["successfully merged two items together"]
# why: no trailing period on the real line -- ends on the item's own
# "+N" tier with nothing after it.
pattern = '''^You have successfully merged two items together to create a new item: (?P<item>.+)$'''
examples = ["[Tue Jul 28 15:02:15 2026] You have successfully merged two items together to create a new item: Thaumaturgist's Robe +2"]
[rule.fields]
item = { from = "item", as = "str" }

[[rule]]
id = "loot.self"
kind = "loot"
priority = 50
anchors = ["You have looted"]
# A stack loots as "You have looted 2 Bone Chips from ..." -- no article, a
# leading count instead. A single item loots as "a"/"an" with no count at
# all. `qty` only participates in the numeral branch; absent (the singular
# case) defaults to 1 in ingest.rs, the same way cast.interrupted's `who`
# only participates in its own branch and defaults to "You" there.
pattern = '''^--You have looted (?:(?P<qty>[0-9]+)|a|an) (?P<item>.+?) from (?P<corpse>.+?)\.--$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] --You have looted a Fragile Pet's Skull from a fragile pet's corpse.--",
  "[Tue Jul 28 15:02:15 2026] --You have looted 2 Bone Chips from a cracked skeleton's corpse.--",
]
[rule.fields]
qty = { from = "qty", as = "u64" }
item = { from = "item", as = "str" }
corpse = { from = "corpse", as = "str" }

[[rule]]
id = "loot.self.direct"
kind = "loot"
priority = 50
anchors = ["You looted"]
# loot.self (above) only ever matches one specific client message -- the
# "--...--" bracketed "You have looted X from Y's corpse.--" form. There
# is a second, completely different message the client also sends on an
# ordinary loot, and checked against a real long-lived log
# (eqlog_Manipulator_rivervale.txt, 2.27M lines): 7,576 lines matched this
# second form against only 546 for the first. The vast majority of real
# loot events were silently invisible to this app before this rule
# existed -- not a mis-attribution bug, a coverage gap.
#
# This second form has no "--" bracketing, says "looted" not "have
# looted", and its trailing clause varies by what happened to the item
# after: sold automatically to a vendor ("and sold it for <currency>."),
# banked as currency ("and stored it in your currency", no trailing
# period), stashed in a tradeskill depot or Dragon Hoard, or combined into
# a higher tier ("to create a <item> +N", also no trailing period). Rather
# than one rule per trailing clause (a new one needed every time the
# client adds another auto-handling option), item/corpse/qty are captured
# up through "'s corpse" and everything after that is matched but mostly
# discarded (`.*$`) -- permissive on purpose, so a trailing clause this
# session's log doesn't happen to contain still parses correctly. The one
# exception: an auto-sell's own "and sold it for <amount>" clause is
# pulled out as `sold_for` -- still just the raw denomination text
# (Ingest::parse_currency_copper does the actual parsing, same "capture
# stays a pure read" reason `corpse` isn't stripped of its "'s corpse"
# suffix here either), but naming it is what lets `record_loot` also
# record the platinum earned, not just the item.
pattern = '''^You looted (?:(?P<qty>[0-9]+)|a|an) (?P<item>.+?) from (?P<corpse>.+?'s corpse)(?: and sold it for (?P<sold_for>[^.]+))?.*$'''
examples = [
  "[Tue Jul 28 15:10:44 2026] You looted a Chunk of Meat from a coyote's corpse and sold it for 1 silver.",
  "[Tue Jul 28 15:31:55 2026] You looted a Mote of Infinitesimal Potential from a dune spiderling's corpse and stored it in your currency",
  "[Tue Jul 28 20:00:22 2026] You looted a Rusty Mace +2 from a patrolling gnoll's corpse to create a Rusty Mace +3",
  "[Tue Jul 28 15:13:00 2026] You looted 2 Deepwater Ink from a swirlspine seahorse's corpse and stored it in your tradeskill depot",
  "[Tue Jul 28 15:10:08 2026] You looted 2 Phosphorous Powder from a zol ghoul knight's corpse and sold it for 2 platinum, 5 gold, 7 silver and 2 copper.",
]
[rule.fields]
qty = { from = "qty", as = "u64" }
item = { from = "item", as = "str" }
corpse = { from = "corpse", as = "str" }
sold_for = { from = "sold_for", as = "str" }

[[rule]]
id = "loot.reward"
kind = "loot"
priority = 50
anchors = ["You looted"]
# why: reward chests auto-sell or bank -- the item name is what matters
pattern = '''^You looted (?:(?P<qty>[0-9]+)|a|an) (?P<item>.+?) from (?P<source>Reward Chest) and (?:sold it for (?P<sold_for>.+?)|stored it in your (?P<stored>tradeskill depot|currency))\.?$'''
examples = [
  "[Tue Sep 08 12:00:00 2026] You looted a Moonstone Ring +4 from Reward Chest and sold it for 6 platinum, 3 gold, 5 silver and 7 copper.",
  "[Tue Sep 08 12:00:00 2026] You looted a Blood Wine from Reward Chest and sold it for free.",
  "[Tue Sep 08 12:00:00 2026] You looted a Gold Ring +4 from Reward Chest and sold it for 8 gold, 5 silver and 7 copper.",
  "[Tue Sep 08 12:00:00 2026] You looted a Fine Steel Two Handed Sword +4 from Reward Chest and sold it for 5 platinum.",
  "[Tue Sep 08 12:00:00 2026] You looted a Jade from Reward Chest and stored it in your tradeskill depot",
  "[Tue Sep 08 12:00:00 2026] You looted 8 Spider Silk from Reward Chest and sold it for 1 platinum, 1 gold, 4 silver and 4 copper.",
  "[Tue Sep 08 12:00:00 2026] You looted 3 Mote of Major Potential from Reward Chest and stored it in your currency",
  "[Tue Sep 08 12:00:00 2026] You looted a Mithril Earring +4 from Reward Chest and sold it for 2 platinum and 5 gold.",
  "[Tue Sep 08 12:00:00 2026] You looted a Crystallized Marrow from Reward Chest and sold it for 1 gold, 7 silver and 9 copper.",
  "[Tue Sep 08 12:00:00 2026] You looted a Torn Page of Magi`kot pg. 3 from Reward Chest and sold it for free.",
]
[rule.fields]
item = { from = "item", as = "str" }
source = { from = "source", as = "str" }

[[rule]]
id = "loot.left_on_corpse"
kind = "loot"
priority = 50
anchors = [" was left on "]
pattern = '''^--(?P<item>.+?) was left on (?P<corpse>.+?)\.--$'''
examples = ["[Tue Sep 08 12:00:00 2026] --a Charred Bone Key was left on a shadowknight's corpse.--"]
[rule.fields]
item = { from = "item", as = "str" }
corpse = { from = "corpse", as = "str" }

[[rule]]
id = "money.vendor_sell"
kind = "money"
priority = 50
anchors = ["You receive"]
# A direct sale to an NPC vendor (not a loot auto-sell -- see `loot.self.
# direct`'s own `sold_for` for that one): "You receive <amount> from
# <vendor> for <item>(s)." `amount` is captured lazily up through the
# first " from " -- the denomination text itself never contains that
# substring, so this is safe regardless of how many denominations are
# present or how they're joined (confirmed against the real log: this
# server phrases the same 4-denomination list two different ways --
# "9 platinum 5 gold 7 silver" here, vs "2 platinum, 5 gold, 7 silver and
# 2 copper" on an auto-sell -- which is exactly why parsing the list's
# internal structure is left to Ingest::parse_currency_copper rather than
# encoded into this pattern). `item` is optional: a bulk sell phrases as
# "for the contents of your bag." with no single item name at all
# (confirmed against the real log, 460 real vendor-sell lines, no
# comma-joined multi-item case seen) -- the alternation falls back to
# matching anything so the line still parses for its currency alone.
pattern = '''^You receive (?P<amount>.+?) from .+ for (?:the (?P<item>.+?)\(s\)|.+)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] You receive 9 platinum 5 gold 7 silver from Klok Koglin for the Gold Malachite Bracelet(s).",
  "[Tue Jul 28 15:02:15 2026] You receive 70 platinum 2 gold from Canarie for the Golden Star Ruby Ring(s).",
  "[Tue Jul 28 15:02:15 2026] You receive 185 platinum from Klok Koglin for the Fire Emerald Platinum Ring(s).",
  "[Tue Jul 28 15:02:15 2026] You receive 12 platinum from Canarie for the contents of your bag.",
]
[rule.fields]
amount = { from = "amount", as = "str" }
item = { from = "item", as = "str" }

[[rule]]
id = "money.received_plain"
kind = "money"
priority = 50
# why: a real, distinct shape from money.vendor_sell -- no "for <item>"
# clause at all (money handed over directly, not paid for a sale).
# Excludes " for " so a real vendor-sell line (which also starts "You
# receive ... from ...") can never double-match this rule too, and
# excludes "from the corpse" -- money.corpse's own, more specific shape.
anchors = ["You receive"]
excludes = [" for ", "from the corpse"]
pattern = '''^You receive (?P<amount>.+?) from [^.]+\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] You receive 3 gold from Groflah Steadirt.",
  "[Tue Jul 28 15:02:15 2026] You receive 5 silver from Groflah Steadirt.",
]
[rule.fields]
amount = { from = "amount", as = "str" }

[[rule]]
id = "outputfile.complete"
kind = "outputfile"
priority = 50
anchors = ["Outputfile Complete"]
# The client's own confirmation that a /outputfile command finished
# writing -- for /outputfile inventory specifically, this is the only log
# signal that a fresh inventory dump exists at all, and the only place its
# exact filename is ever stated. The dump itself lands one directory above
# Logs (the game's base install folder, see AppConfig's doc in
# eqlp-app::config), never in the log stream -- this line is a pointer to
# it, not the data itself.
pattern = '''^Outputfile Complete: (?P<file>.+)$'''
examples = [
  "[Sun Aug 16 08:24:59 2026] Outputfile Complete: Manipulator_rivervale-Inventory.txt",
]
[rule.fields]
file = { from = "file", as = "str" }

[[rule]]
id = "money.corpse"
kind = "money"
priority = 40
anchors = ["from the corpse"]
pattern = '''^You receive (?P<amount>.+?) from the corpse\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You receive 3 silver and 4 copper from the corpse."]
[rule.fields]
amount = { from = "amount", as = "str" }

[[rule]]
id = "money.item_currency"
kind = "money"
priority = 40
anchors = ["from that item"]
# why: a real 3rd currency-receipt shape, distinct from both
# money.vendor_sell ("You receive X from Y for Z") and money.corpse
# ("...from the corpse.") -- a tradeskill/salvage byproduct, no vendor
# or corpse named at all.
pattern = '''^You received (?P<amount>.+?) from that item\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You received 1 platinum, 1 gold, 2 silver and 8 copper from that item."]
[rule.fields]
amount = { from = "amount", as = "str" }

[[rule]]
id = "money.purchase"
kind = "money"
priority = 50
anchors = ["You purchased "]
# why: distinct from money.vendor_sell above (that's selling to a
# vendor, this is buying from one). amount can be genuinely blank (a
# free/quest item, real: "You purchased 1 Package for Old Doug from
# Dougina for .") -- captured permissively, not required.
pattern = '''^You purchased (?P<qty>[0-9]+) (?P<item>.+?) from (?P<vendor>.+?) for\s*(?P<amount>[^.]*)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] You purchased 1 Backpack from Neuven for  7 gold 7 copper.",
  "[Tue Jul 28 15:02:15 2026] You purchased 1 Package for Old Doug from Dougina for .",
]
[rule.fields]
qty = { from = "qty", as = "u64" }
item = { from = "item", as = "str" }
vendor = { from = "vendor", as = "str" }
amount = { from = "amount", as = "str" }

[[rule]]
id = "trade.complete"
kind = "trade"
priority = 50
anchors = ["You complete the trade with"]
pattern = '''^You complete the trade with (?P<who>.+?)\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You complete the trade with Dead Doug."]
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "trade.offered"
kind = "trade"
priority = 50
anchors = ["You offered "]
# why: an item handed to an NPC mid-trade (quest turn-in, pet-summoning
# skull, etc) -- "The @" targets (e.g. "The Gobbler") need no special
# case, `who`'s own lazy match already covers them.
pattern = '''^You offered (?P<qty>[0-9]+) (?P<item>.+?) to (?P<who>.+?)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] You offered 1 Fragile Pet's Skull to Dead Doug.",
  "[Tue Jul 28 15:02:15 2026] You offered 1 Preserved Leg to The Gobbler.",
]
[rule.fields]
qty = { from = "qty", as = "u64" }
item = { from = "item", as = "str" }
who = { from = "who", as = "str" }

