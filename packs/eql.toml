# EverQuest Legends rule pack.
#
# Every pattern here was derived from an actual 1.83M-line log
# (eqlog_Manipulator_rivervale.txt, Jul 28 - Aug 09 2026) via `eqlp shapes`.
# No line format in this file is guessed. Where classic-EQ intuition and the
# log disagreed, the log won -- notably:
#
#   * XP is "You gain experience! (11.000%)", not the classic "experience!!",
#     and it carries a percentage.
#   * Spell damage is "<src> hit <dst> for N points of <type> damage by
#     <spell>." A bare, sourceless "You were hit by non-melee for N
#     damage." also exists for real (288 occurrences, see
#     damage.non_melee_self) -- an earlier version of this note claimed
#     no such line existed at all; that was wrong.
#   * Heals are "<src> healed <dst> for N hit points by <spell>.", with an
#     optional "(M)" giving the uncapped amount.
#   * Loot names the corpse: "--You have looted a X from a Y's corpse.--"
#
# Regenerate the backlog after any patch with:
#   eqlp coverage --pack packs/eql.toml yourlog.txt --top 40

name = "eql"
version = 1
header = "bracket-ctime"

# ============================================================ chat
# High priority: chat text can contain literally any other line as a quote,
# so these must win before combat rules get a look.

[[rule]]
id = "chat.channel"
kind = "chat"
priority = 100
anchors = [" tell"]
pattern = '''^(?P<who>.+?) tells? (?P<chan>[A-Za-z0-9_]+):(?P<num>[0-9]+), '(?P<text>.*)'$'''
examples = [
  "[Tue Sep 08 12:00:00 2026] You tell General2:1, 'Garrison's Mighty Mana Shock X'","[Tue Jul 28 15:02:15 2026] Moosey tells NewPlayers:1, 'sneak is critical to most spell acquisition at this point'"]
# Was captured by the pattern but never exposed here -- `extract_action`'s
# "chat.channel" arm reads `who` to build `Action::PlayerProof`, but with
# no `[rule.fields]` block at all every field lookup silently returned
# `Value::Missing`, so this rule could never actually prove a player via
# a numbered channel -- confirmed directly (not assumed): a debug probe
# showed the rule matching correctly but `str_field("who")` still `None`.
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "chat.directed"
kind = "chat"
priority = 90
anchors = ["'"]
pattern = '''^(?P<who>.+?) (?P<chan>tells you|tells the guild|tells the group|tells the raid|tell your party|tell your raid|tell the guild|tell the group|say to your guild|says out of character|say out of character|auctions|auction|shouts|shout|says|say), '(?P<text>.*)'$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Kaeus tells you, 'I'm busy right now.'",
  "[Tue Jul 28 15:02:15 2026] You tell your party, 'yo'",
  "[Tue Jul 28 17:09:49 2026] You say to your guild, 'hallo'",
  "[Wed Aug 05 21:44:57 2026] Mits tells the raid, 'I'm down for D0-D4 tbh.'",
  "[Wed Aug 05 21:45:11 2026] You tell your raid, 'yo!'",
  "[Tue Jul 28 15:02:15 2026] Honeybadger says out of character, 'where can i buy pet supplies'",
  "[Tue Jul 28 15:02:15 2026] Biscuits auctions, 'wtb thumper +4'",
  "[Tue Jul 28 15:02:15 2026] You say, 'send'",
  "[Tue Jul 28 15:02:15 2026] Dead Doug says, 'Ahh Dougrick, I knew him well'",
]
# Same real, previously-undiscovered gap as "chat.channel" above -- no
# `[rule.fields]` block meant `extract_action`'s "chat.directed" arm could
# never actually read `who`/`chan`, so `Action::PlayerProof` (the whole
# chat-proof half of ally detection, `Entities::note_player_channel`) was
# silently dead code this entire project's history -- confirmed via a
# direct debug probe against a real matched line, not assumed from reading
# the code. `text` added for the Social tab's own guild/party/raid/PM
# history -- "tells the raid"/"tell your raid" added the same time, a
# real gap: 422 real "tells the raid" lines existed in the reference log
# and matched no rule at all until now.
[rule.fields]
who = { from = "who", as = "str" }
chan = { from = "chan", as = "str" }
text = { from = "text", as = "str" }

[[rule]]
id = "chat.tell_sent"
kind = "chat"
priority = 90
anchors = ["You told "]
# why: the outgoing half of chat.npc_told's own shape, reversed --
# 1,388 real occurrences in the reference log, previously unmatched by
# anything (chat.npc_told's own anchor, " told you, '", never fires on
# "You told <name>, '...'" -- different word after "told"). NPC replies
# also say "X told you" (chat.npc_told), never "You told X" (only a
# real tell you sent can read this way), so no overlap risk.
pattern = '''^You told (?P<who>.+?), '(?P<text>.*)'$'''
examples = [
  "[Thu Jul 30 22:47:34 2026] You told Opticon, 'want some free stuff?'",
]
[rule.fields]
who = { from = "who", as = "str" }
text = { from = "text", as = "str" }

[[rule]]
id = "chat.npc_told"
kind = "chat"
priority = 80
anchors = [" told you, '"]
# why: the client's own past-tense phrasing for NPC replies (vendor
# price quotes, quest dialogue, "I am unable to wake X" pet responses,
# taunt/attack narration) -- distinct verb from chat.directed's player
# forms above ("tells you"/"says"/etc), 9,164 real occurrences across
# 244 distinct speakers. One general rule, not one per trailing
# phrasing -- same reasoning money.vendor_sell's own doc gives for not
# parsing a currency list's internal structure inline.
pattern = '''^(?P<who>.+?) told you, '(?P<text>.*)'$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Canarie told you, 'I'll give you 1 platinum 2 gold 8 silver 5 copper for the Silver Carnelian Wedding Ring.'",
  "[Tue Jul 28 15:02:15 2026] Janer told you, 'I am unable to wake Soldier of V`Zher, Master.'",
  "[Tue Jul 28 15:02:15 2026] Zobobtik told you, 'Attacking Gynok Moltor Master.'",
]
[rule.fields]
who = { from = "who", as = "str" }
text = { from = "text", as = "str" }

[[rule]]
id = "con.consider"
kind = "con"
priority = 50
anchors = [" -- ", "(Lvl: "]
# why: the classic "consider" con-color result -- 16 distinct real
# flavor phrases confirmed, all sharing this exact frame with a level in
# parens at the end (no trailing period on the line itself).
pattern = '''^(?P<who>.+?) (?P<relation>regards you indifferently|judges you amiably|scowls at you, ready to attack|looks upon you warmly|glares at you threateningly|glowers at you dubiously|kindly considers you|looks your way apprehensively|regards you as an ally) -- (?P<flavor>.+?) \(Lvl: (?P<level>[0-9]+)\)$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Doug regards you indifferently -- looks like quite a gamble. (Lvl: 5)",
  "[Tue Jul 28 15:02:15 2026] Guard Swang regards you indifferently -- what would you like your tombstone to say? (Lvl: 35)",
  "[Tue Sep 08 12:00:00 2026] Heart harpie judges you amiably -- what would you like your tombstone to say? (Lvl: 58)",
  "[Tue Sep 08 12:00:00 2026] Verishe Mal Judge scowls at you, ready to attack -- what would you like your tombstone to say? (Lvl: 39)",
  "[Tue Sep 08 12:00:00 2026] An abhorrent judges you amiably -- it appears to be quite formidable. (Lvl: 49)",
  "[Tue Sep 08 12:00:00 2026] Eye of Manipulator judges you amiably -- You could probably win this fight. (Lvl: 1)",
  "[Tue Sep 08 12:00:00 2026] A sonic bat scowls at you, ready to attack -- looks like it would wipe the floor with you! (Lvl: 38)",
  "[Tue Sep 08 12:00:00 2026] A sonic bat scowls at you, ready to attack -- it appears to be quite formidable. (Lvl: 38)",
  "[Tue Sep 08 12:00:00 2026] Guard Koranin judges you amiably -- looks kind of dangerous. (Lvl: 38)",
  "[Tue Sep 08 12:00:00 2026] Lokar To`Biath looks your way apprehensively -- what would you like your tombstone to say? (Lvl: 11)",
  "[Tue Sep 08 12:00:00 2026] Tegea Prendyn regards you as an ally -- You could probably win this fight. (Lvl: 25)",
  "[Tue Sep 08 12:00:00 2026] Merchant Ulyssa regards you as an ally -- what would you like your tombstone to say? (Lvl: 40)",
]
[rule.fields]
who = { from = "who", as = "str" }
flavor = { from = "flavor", as = "str" }
level = { from = "level", as = "u64" }
relation = { from = "relation", as = "str" }

[[rule]]
id = "con.consider_unleveled"
kind = "con"
priority = 50
anchors = [" -- "]
excludes = ["(Lvl: "]
# why: the same frame with no level in parens -- seen on a few named mobs
pattern = '''^(?P<who>.+?) (?P<relation>regards you indifferently|judges you amiably|scowls at you, ready to attack|looks upon you warmly|glares at you threateningly|glowers at you dubiously|kindly considers you|looks your way apprehensively|regards you as an ally) -- (?P<flavor>.+?)$'''
examples = ["[Tue Sep 08 12:00:00 2026] Bhaalgorn regards you indifferently -- what would you like your tombstone to say?"]
[rule.fields]
who = { from = "who", as = "str" }
relation = { from = "relation", as = "str" }

[[rule]]
