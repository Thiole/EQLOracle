[[rule]]
id = "melee.riposted"
kind = "block"
priority = 30
anchors = ["riposte"]
# Same shape as melee.blocked/melee.dodged/melee.parried -- the real 5th
# avoidance type (melee.parried's own "4th" note was written before this
# one was found; 231 real occurrences in the reference log). `ripostes|
