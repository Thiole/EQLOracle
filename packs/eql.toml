anchors = ["You have entered"]
excludes = ["an area where"]
# why: a zone label is a proper noun -- the game reuses this phrasing for
# sub-areas inside a zone ("an Arena (PvP) area"), and taking one as a
# zone change blanks the map until the next real zone line
pattern = '''^You have entered (?P<zone>[A-Z].+?)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] You have entered The Northern Desert of Ro.",
  "[Tue Jul 28 15:02:15 2026] You have entered New Sebilis Expedition.",
]
[rule.fields]
zone = { from = "zone", as = "str" }

[[rule]]
id = "state.location"
kind = "state"
priority = 40
anchors = ["Your Location is"]
# The "/loc" command's own output. Rare -- only appears when the player
# types it manually (confirmed: once in 2.8M lines of the reference log)
# -- so this is a "last known position" snapshot, not continuous
# tracking. Fields mix bare integers and decimals in real map data (see
# packs/eql.toml's mapsdata.rs sibling), so the coordinate group accepts
# both.
pattern = '''^Your Location is (?P<x>-?[0-9]+(?:\.[0-9]+)?), (?P<y>-?[0-9]+(?:\.[0-9]+)?), (?P<z>-?[0-9]+(?:\.[0-9]+)?)$'''
examples = ["[Tue Aug 18 22:28:36 2026] Your Location is 216.51, -103.09, -20.19"]
[rule.fields]
x = { from = "x", as = "f64" }
y = { from = "y", as = "f64" }
z = { from = "z", as = "f64" }

[[rule]]
id = "proc.item"
kind = "proc"
priority = 30
anchors = ["Your ", ") "]
pattern = '''^Your (?P<item>.+?) \((?P<effect>[^()]+)\) (?P<msg>.+)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Your Flowing Black Robe (Exaltation) flickers with a pale light.",
  "[Tue Jul 28 15:02:15 2026] Your Black Tome with Silver Runes (Exaltation) feels alive with power.",
]
[rule.fields]
item = { from = "item", as = "str" }
effect = { from = "effect", as = "str" }
message = { from = "msg", as = "str" }

[[rule]]
id = "proc.item_unnamed"
kind = "proc"
priority = 30
anchors = ["feels alive with power"]
# why: proc.item above requires a named "(Effect)" clause -- some items
# proc without one, same trailing message otherwise. Confirmed real and
# narrow: of 38,232 real "feels alive with power" lines, 1,351 have no
# parenthetical at all; it's the only message seen in this exact
# unparenthesized shape, so a fixed-suffix rule is safe here (a bare
# `(?P<item>.+?) (?P<msg>.+)\.$` would be genuinely ambiguous with no
# anchor between item and message). `[^()]+?` (not `.+?`) for item is
# deliberate -- keeps this from also matching proc.item's own
# parenthesized shape (lint's own ambiguity check caught the overlap
# when this used a bare `.+?`), a real item name never contains parens
# in this pack's own established convention (see proc.item itself).
pattern = '''^Your (?P<item>[^()]+?) feels alive with power\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Your Bone-Clasped Girdle feels alive with power."]
[rule.fields]
item = { from = "item", as = "str" }

# ============================================================ noise
# Not interesting, but 141k lines of it. Claiming known-boring lines keeps the
# unmatched backlog honest -- what's left is genuinely unhandled.

[[rule]]
id = "noise.command_blocked"
kind = "noise"
priority = 60
anchors = ["use that command right now"]
pattern = '''^You can't use that command right now\.\.\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You can't use that command right now..."]

[[rule]]
# why: split off state.you_stunned/state.you_stun_ended below -- those 2
# of the original 5 texts are real ON/OFF transitions, these remaining 3
# never were (a reminder you're already stunned, an avoided attempt that
# never landed, and "the stun would refresh but doesn't" -- Confrontation's
# own text, not a state change on its own account)
id = "noise.stunned"
kind = "noise"
priority = 60
anchors = ["stun"]
pattern = '''^(?:You can't cast spells while stunned!|You avoid the stunning blow\.)$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] You can't cast spells while stunned!",
  "[Tue Jul 28 15:02:15 2026] You avoid the stunning blow.",
]

[[rule]]
# why: CC overlay's Stun square -- real, dedicated ON/OFF pair, 2,302 /
# 2,342 real occurrences in the reference log. "You overcome the stun!"
# counts as ending it early (a resist-mid-effect), same bucket as the
# natural "no longer stunned" expiry -- see effects.rs's own doc.
id = "state.you_stunned"
kind = "state"
priority = 50
anchors = ["You are stunned!"]
pattern = '''^You are stunned!$'''
examples = ["[Tue Jul 28 15:02:15 2026] You are stunned!"]

[[rule]]
# why: single "stun" anchor, not one per alternative -- the engine
# requires *every* declared anchor present (AND, not OR; confirmed via
# engine.rs's own select_candidates), so listing two non-overlapping
# phrases here would make this rule impossible to ever match. "stun" is
# a real substring of both real alternatives ("stunned"/"the stun!").
id = "state.you_stun_ended"
kind = "state"
priority = 50
anchors = ["stun"]
pattern = '''^(?:You are no longer stunned\.|You overcome the stun!)$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] You are no longer stunned.",
  "[Tue Jul 28 15:02:15 2026] You overcome the stun!",
]

[[rule]]
# why: CC overlay's Root square -- this game calls it "ensnared", not
# "rooted" (confirmed in the reference log, no "rooted" text exists at
# all); real dedicated ON/OFF pair, 104 / 97 real occurrences, previously
# matched by nothing at all.
id = "state.you_ensnared"
kind = "state"
priority = 50
anchors = ["You are ensnared."]
pattern = '''^You are ensnared\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You are ensnared."]

[[rule]]
id = "state.you_ensnared_ended"
kind = "state"
priority = 50
anchors = ["no longer ensnared"]
pattern = '''^You are no longer ensnared\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You are no longer ensnared."]

[[rule]]
# why: CC overlay's Fear square -- rough, not exhaustive: unlike Stun/
# Root, "Fear" isn't a real spell_type in the wiki scrape at all, so
# there's no clean category to pull from. This alternation is a curated
# list of real `msg_cast_on_you` text from spells.json whose own
# name/description is unambiguously fear-shaped (Fear, Inspire/Invoke/
# Wave of Fear, Cloud of Fear, Blinding Fear, Dragon Roar, Angstlich's
# Appalling Screech, Song of Midnight, Terror of Darkness/Shadows,
# Screaming Terror, Trepidation) -- confirmed real text, not guessed,
# but a fear effect outside this list won't register as ON. The single
# wear-off line ("You are no longer afraid.") is shared across every
# source (no per-spell wears-off text exists), same "no caster, shared
# text" shape state.mesmerized/state.charmed already have -- fine, since
# this only needs ON/OFF, not which spell.
# why: single generic space anchor, not one per alternative -- these 9
# real texts share no common substring, and the engine requires *every*
# declared anchor present (AND, not OR; see state.you_stun_ended's own
# doc). Same trivial-anchor move state.misc already makes for its own
# diverse 38-phrase bundle.
id = "state.you_feared"
kind = "state"
priority = 50
anchors = [" "]
pattern = '''^(?:Your mind fills with fear\.|Your mind is wracked by fear\.|You freeze in terror\.|You flee in terror\.|Your mind snaps in terror\.|Dark terror fills your mind\.|Shadowed terror fills your mind\.|Your mind fills with trepidation\.|You begin to scream\.)$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Your mind fills with fear.",
  "[Tue Jul 28 15:02:15 2026] You freeze in terror.",
  "[Tue Jul 28 15:02:15 2026] You flee in terror.",
]

[[rule]]
id = "state.you_fear_ended"
kind = "state"
priority = 50
anchors = ["no longer afraid"]
pattern = '''^You are no longer afraid\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You are no longer afraid."]

[[rule]]
# why: the game's GENERIC loss-of-control landing -- fear, charm-on-you,
# and captivate all open with this one line, and only the ender reveals
# which (measured on the reference log: 127 landings; 82 resolved "no
# longer afraid", 18 "captivated", 14 "charmed", the rest died
# controlled). Its own CC square (Ctrl), never folded into Fear -- that
# mapping would be wrong ~35% of the time.
id = "state.you_lose_control"
kind = "state"
priority = 50
anchors = ["You lose control of yourself"]
pattern = '''^You lose control of yourself!$'''
examples = ["[Tue Jul 28 15:02:15 2026] You lose control of yourself!"]

[[rule]]
# why: the charm/captivate enders of the generic landing; the fear ender
# ("no longer afraid") already exists as state.you_fear_ended and ends
# both squares -- see ingest's FearEnded arm
id = "state.you_control_ended"
kind = "state"
priority = 50
# why: trivial anchor -- anchors AND together and these three enders
# share no substring; same move state.misc/state.you_feared make.
# "You have control of yourself again." is the generic landing's own
# direct recovery line (121 real occurrences), pulled out of
# state.misc's bundle along with the landing itself
anchors = [" "]
pattern = '''^(?:You are no longer (?:charmed|captivated)\.|You have control of yourself again\.)$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] You are no longer charmed.",
  "[Tue Jul 28 15:02:15 2026] You are no longer captivated.",
  "[Tue Jul 28 15:02:15 2026] You have control of yourself again.",
]

