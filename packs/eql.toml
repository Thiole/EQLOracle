pattern = '''^(?:AFK |<LFG> |AFK <LFG> )?\[(?P<level>\d+) (?P<classes>[A-Z]{3}(?:/[A-Z]{3}){0,2})\] (?P<name>[A-Za-z]+) \((?P<race>[^)]+)\)(?: <(?P<guild>[^>]*)>)?\s+ZONE: (?P<zone>.+?)\s*$'''
