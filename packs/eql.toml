[[rule]]
id = "mobstate.magical_skin_absorbs"
kind = "mobstate"
priority = 20
anchors = ["'s magical skin absorbs the damage of "]
# why: `(?:'s )?` -- "YOUR flames" (2nd-person pronoun, already
# possessive on its own) has no "'s" the way a real name's own
# possessive ("Bravesirrobin's thorns") does. Same real gap ds.damage's
# own doc already found and fixed for this exact source-name shape.
pattern = '''^(?P<who>.+?)'s magical skin absorbs the damage of (?P<source>.+?)(?:'s)? (?:flames|thorns|frost)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Kahaptra Z`Taj's magical skin absorbs the damage of Bravesirrobin's thorns.",
  "[Tue Jul 28 15:02:15 2026] Konarer's magical skin absorbs the damage of Nisch Val Torash Mashk's flames.",
  "[Tue Jul 28 15:02:15 2026] A yun ghoul wizard's magical skin absorbs the damage of YOUR flames.",
  "[Tue Sep 08 12:00:00 2026] A fire giant warrior's magical skin absorbs the damage of Aegiisfang's frost.",
]
[rule.fields]
who = { from = "who", as = "str" }
source = { from = "source", as = "str" }

[[rule]]
id = "melee.magical_skin_absorbed"
kind = "block"
priority = 30
anchors = ["magical skin absorbs the blow!"]
# why: not one of the real 4 avoidance types (block/dodge/parry/riposte)
# -- a magical damage-absorb, not a defender's own evasion skill -- but
# same "attack landed, no damage got through" bucket, same reason
# ds.damage's own kind groups a damage-shield's damage with plain hits.
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?:on )?(?P<dst>.+?), but (?:(?P<dst2>.+?)'s|YOUR) magical skin absorbs the blow!(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Sep 08 12:00:00 2026] An azarack tries to hit YOU, but YOUR magical skin absorbs the blow!",
  "[Tue Sep 08 12:00:00 2026] A loathling lich tries to slice YOU, but YOUR magical skin absorbs the blow!",
  "[Tue Sep 08 12:00:00 2026] Quag Maelstrom tries to hit Xasartik, but Xasartik's magical skin absorbs the blow! (Riposte)",
  "[Thu Jul 30 17:20:58 2026] Dippinsauce tries to frenzy on The Blood Artist, but The Blood Artist's magical skin absorbs the blow!",
  "[Tue Jul 28 15:02:15 2026] Bravesirrobin tries to hit Kahaptra Z`Taj, but Kahaptra Z`Taj's magical skin absorbs the blow!",
]
[rule.fields]
flag = { from = "flag", as = "str" }
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
verb = { from = "verb", as = "str" }

[[rule]]
id = "mobstate.staggers_hazard"
kind = "mobstate"
priority = 20
anchors = [" slams "]
# why: a trap/environmental proc, not mob.state's own fixed-alternation
# shape -- the hazard itself varies (only 2 real values found: "dagger
# of frost"/"frost shard"), so it needs its own capture instead of a
# literal alternative there. `who` covers both self ("You"/"YOU") and
# third-person the same lazy way mob.state's own `who` does.
pattern = '''^(?P<who>.+?) stagger(?:s)? as a (?P<hazard>dagger of frost|frost shard) slams (?:into|against) (?:them|you)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Bravesirrobin staggers as a dagger of frost slams into them.",
  "[Tue Jul 28 15:02:15 2026] You stagger as a dagger of frost slams into you.",
