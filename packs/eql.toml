examples = ["[Tue Jul 28 15:02:15 2026] Your guildmate Kaeus has completed The Commonlands Traveler achievement."]
[rule.fields]
who = { from = "who", as = "str" }
name = { from = "name", as = "str" }

[[rule]]
id = "achievement.self"
kind = "achievement"
priority = 50
anchors = [" has completed achievement: "]
pattern = '''^(?P<who>.+?) has completed achievement: (?P<name>.+)$'''
examples = ["[Tue Jul 28 15:02:15 2026] Train has completed achievement: Oggok Traveler"]
[rule.fields]
who = { from = "who", as = "str" }
name = { from = "name", as = "str" }

[[rule]]
id = "achievement.you_completed"
kind = "achievement"
priority = 50
anchors = ["You have completed achievement: "]
# why: same shape as achievement.self, but "You have" not "X has" --
# a real verb-conjugation split, not a substitutable case.
pattern = '''^You have completed achievement: (?P<name>.+)$'''
examples = ["[Tue Jul 28 15:02:15 2026] You have completed achievement: Oggok Traveler"]
[rule.fields]
name = { from = "name", as = "str" }

[[rule]]
id = "task.updated"
