[[rule]]
id = "track.direction"
kind = "noise"
priority = 60
# why: the Tracking radar's own directional readout -- pure UI feedback,
# not a discrete game-state change (the target's real position is what
# matters, this is just a compass hint toward it). Real compound shape:
# an optional horizontal component (straight ahead/ahead/behind/to the
# left/to the right, or a horizontal pair like "ahead and to the left"),
# an optional vertical component (above/below you), joined by "and" when
# there are 2 parts or Oxford-comma-style when there are 3 -- "you" only
# appears on the final component ("behind you" alone, but "behind and to
# the right" with none, and "...and below you" when vertical is present).
# Built from real observed combinations, not a guessed-at full grammar --
# 3-part lists use an Oxford comma before the final "and" ("ahead, to the
# right, and below you"), 2-part lists just " and ", explicitly enumerated
# rather than generalized since the comma placement isn't uniform.
anchors = [" is "]
pattern = '''^(?P<who>.+?) is (?P<direction>straight ahead(?: and (?:above|below) you)?|ahead(?: and to the (?:left|right))?(?: and (?:above|below) you)?|behind(?: and to the (?:left|right))?(?: and (?:above|below) you)?|to the (?:left|right)(?: and (?:above|below) you)?|ahead, to the (?:left|right), and (?:above|below) you|behind, to the (?:left|right), and (?:above|below) you|behind you|ahead of you)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] An ire ghast is straight ahead.",
  "[Tue Jul 28 15:02:15 2026] Groflah Steadirt is ahead and to the left.",
  "[Tue Jul 28 15:02:15 2026] Groflah Steadirt is behind you.",
  "[Tue Jul 28 15:02:15 2026] An ire ghast is straight ahead and above you.",
  "[Tue Jul 28 15:02:15 2026] An ire ghast is to the right and above you.",
  "[Tue Jul 28 15:02:15 2026] Groflah Steadirt is behind and to the right.",
  "[Tue Jul 28 15:02:15 2026] Voidling is ahead, to the right, and below you.",
]
[rule.fields]
who = { from = "who", as = "str" }
direction = { from = "direction", as = "str" }

