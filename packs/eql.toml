# EverQuest Legends rule pack.
#
# Every pattern here was derived from an actual 1.83M-line log
# (eqlog_Manipulator_rivervale.txt, Jul 28 - Aug 09 2026) via `eqlp shapes`.
# No line format in this file is guessed. Where classic-EQ intuition and the
# log disagreed, the log won -- notably:
#
#   * XP is "You gain experience! (11.000%)", not the classic "experience!!",
#     and it carries a percentage.
#   * Spell damage is "<src> hit <dst> for N points of <type> damage by
#     <spell>." A bare, sourceless "You were hit by non-melee for N
#     damage." also exists for real (288 occurrences, see
#     damage.non_melee_self) -- an earlier version of this note claimed
#     no such line existed at all; that was wrong.
#   * Heals are "<src> healed <dst> for N hit points by <spell>.", with an
#     optional "(M)" giving the uncapped amount.
#   * Loot names the corpse: "--You have looted a X from a Y's corpse.--"
#
# Regenerate the backlog after any patch with:
#   eqlp coverage --pack packs/eql.toml yourlog.txt --top 40

name = "eql"
version = 1
header = "bracket-ctime"

# ============================================================ chat
# High priority: chat text can contain literally any other line as a quote,
# so these must win before combat rules get a look.

[[rule]]
id = "chat.channel"
kind = "chat"
priority = 100
anchors = [" tells "]
pattern = '''^(?P<who>.+?) tells (?P<chan>[A-Za-z0-9_]+):(?P<num>[0-9]+), '(?P<text>.*)'$'''
examples = ["[Tue Jul 28 15:02:15 2026] Moosey tells NewPlayers:1, 'sneak is critical to most spell acquisition at this point'"]
# Was captured by the pattern but never exposed here -- `extract_action`'s
# "chat.channel" arm reads `who` to build `Action::PlayerProof`, but with
# no `[rule.fields]` block at all every field lookup silently returned
# `Value::Missing`, so this rule could never actually prove a player via
# a numbered channel -- confirmed directly (not assumed): a debug probe
# showed the rule matching correctly but `str_field("who")` still `None`.
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "chat.directed"
kind = "chat"
priority = 90
anchors = ["'"]
pattern = '''^(?P<who>.+?) (?P<chan>tells you|tells the guild|tells the group|tell your party|tell the guild|tell the group|says out of character|say out of character|auctions|auction|shouts|shout|says|say), '(?P<text>.*)'$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Kaeus tells you, 'I'm busy right now.'",
  "[Tue Jul 28 15:02:15 2026] You tell your party, 'yo'",
  "[Tue Jul 28 15:02:15 2026] Honeybadger says out of character, 'where can i buy pet supplies'",
  "[Tue Jul 28 15:02:15 2026] Biscuits auctions, 'wtb thumper +4'",
  "[Tue Jul 28 15:02:15 2026] You say, 'send'",
  "[Tue Jul 28 15:02:15 2026] Dead Doug says, 'Ahh Dougrick, I knew him well'",
]
# Same real, previously-undiscovered gap as "chat.channel" above -- no
# `[rule.fields]` block meant `extract_action`'s "chat.directed" arm could
# never actually read `who`/`chan`, so `Action::PlayerProof` (the whole
# chat-proof half of ally detection, `Entities::note_player_channel`) was
# silently dead code this entire project's history -- confirmed via a
# direct debug probe against a real matched line, not assumed from reading
# the code.
[rule.fields]
who = { from = "who", as = "str" }
chan = { from = "chan", as = "str" }

[[rule]]
id = "chat.npc_told"
kind = "chat"
priority = 80
anchors = [" told you, '"]
# why: the client's own past-tense phrasing for NPC replies (vendor
# price quotes, quest dialogue, "I am unable to wake X" pet responses,
# taunt/attack narration) -- distinct verb from chat.directed's player
# forms above ("tells you"/"says"/etc), 9,164 real occurrences across
# 244 distinct speakers. One general rule, not one per trailing
# phrasing -- same reasoning money.vendor_sell's own doc gives for not
# parsing a currency list's internal structure inline.
pattern = '''^(?P<who>.+?) told you, '(?P<text>.*)'$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Canarie told you, 'I'll give you 1 platinum 2 gold 8 silver 5 copper for the Silver Carnelian Wedding Ring.'",
  "[Tue Jul 28 15:02:15 2026] Janer told you, 'I am unable to wake Soldier of V`Zher, Master.'",
  "[Tue Jul 28 15:02:15 2026] Zobobtik told you, 'Attacking Gynok Moltor Master.'",
]
[rule.fields]
who = { from = "who", as = "str" }
text = { from = "text", as = "str" }

[[rule]]
id = "con.consider"
kind = "con"
priority = 50
anchors = [" regards you indifferently -- "]
# why: the classic "consider" con-color result -- 16 distinct real
# flavor phrases confirmed, all sharing this exact frame with a level in
# parens at the end (no trailing period on the line itself).
pattern = '''^(?P<who>.+?) regards you indifferently -- (?P<flavor>.+?) \(Lvl: (?P<level>[0-9]+)\)$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Doug regards you indifferently -- looks like quite a gamble. (Lvl: 5)",
  "[Tue Jul 28 15:02:15 2026] Guard Swang regards you indifferently -- what would you like your tombstone to say? (Lvl: 35)",
]
[rule.fields]
who = { from = "who", as = "str" }
flavor = { from = "flavor", as = "str" }
level = { from = "level", as = "u64" }

[[rule]]
id = "achievement.guildmate"
kind = "achievement"
priority = 50
anchors = ["Your guildmate "]
pattern = '''^Your guildmate (?P<who>.+?) has completed (?P<name>.+?) achievement\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Your guildmate Kaeus has completed The Commonlands Traveler achievement."]
[rule.fields]
who = { from = "who", as = "str" }
name = { from = "name", as = "str" }

[[rule]]
id = "achievement.self"
kind = "achievement"
priority = 50
anchors = [" has completed achievement: "]
pattern = '''^(?P<who>.+?) has completed achievement: (?P<name>.+)$'''
examples = ["[Tue Jul 28 15:02:15 2026] Train has completed achievement: Oggok Traveler"]
[rule.fields]
who = { from = "who", as = "str" }
name = { from = "name", as = "str" }

[[rule]]
id = "achievement.you_completed"
kind = "achievement"
priority = 50
anchors = ["You have completed achievement: "]
# why: same shape as achievement.self, but "You have" not "X has" --
# a real verb-conjugation split, not a substitutable case.
pattern = '''^You have completed achievement: (?P<name>.+)$'''
examples = ["[Tue Jul 28 15:02:15 2026] You have completed achievement: Oggok Traveler"]
[rule.fields]
name = { from = "name", as = "str" }

[[rule]]
id = "task.updated"
kind = "quest"
priority = 50
anchors = ["Your task '"]
pattern = '''^Your task '(?P<task>.*)' has been updated\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Your task 'Something is Wrrrong' has been updated."]
[rule.fields]
task = { from = "task", as = "str" }

[[rule]]
id = "group.invited"
kind = "group"
priority = 50
anchors = ["to join your group"]
pattern = '''^You invite (?P<who>.+?) to join your group\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You invite Dippinsauce to join your group."]
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "group.member_joined"
kind = "group"
priority = 50
anchors = [" has joined the group"]
pattern = '''^(?P<who>.+?) has joined the group\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Dippinsauce has joined the group."]
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "group.you_joined"
kind = "group"
priority = 50
anchors = ["You have joined the group"]
pattern = '''^You have joined the group\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You have joined the group."]

[[rule]]
id = "group.you_removed"
kind = "group"
priority = 50
anchors = ["You have been removed from the group"]
pattern = '''^You have been removed from the group\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You have been removed from the group."]

[[rule]]
id = "group.left"
kind = "group"
priority = 50
anchors = [" has left the group"]
pattern = '''^(?P<who>.+?) has left the group\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Bravesirrobin has left the group."]
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "group.you_leader"
kind = "group"
priority = 50
anchors = ["now the leader of your group"]
pattern = '''^You are now the leader of your group\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You are now the leader of your group."]

[[rule]]
id = "noise.channel_full"
kind = "noise"
priority = 50
anchors = ["was too full to join"]
pattern = '''^Channel (?P<channel>.+?) was too full to join$'''
examples = ["[Tue Jul 28 15:02:15 2026] Channel NewPlayers was too full to join"]
[rule.fields]
channel = { from = "channel", as = "str" }

# ============================================================ combat

[[rule]]
id = "melee.hit"
kind = "damage"
priority = 30
# Anchor is " of damage." rather than "points of damage." because 30,164 lines
# in the reference log use the singular "1 point of damage" -- anchoring on
# the plural silently dropped every one of them.
anchors = [" of damage."]
pattern = '''^(?P<src>.+?) (?P<verb>slashes|slash|bashes|bash|kicks|kick|hits|hit|cleaves|cleave|punches|punch|crushes|crush|pierces|pierce|strikes|strike|bites|bite|frenzies|frenzy|backstabs|backstab|reaves|reave|smites|smite|shoots|shoot|slices|slice|claws|claw|smashes|smash|mauls|maul|gores|gore|stings|sting) (?P<dst>.+?) for (?P<amt>[0-9,]+) points? of damage\.(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Bouncer Krik slashes Beba for 59 points of damage.",
  "[Tue Jul 28 15:02:15 2026] Morbes bashes Pandos Flintside for 1 point of damage.",
  "[Tue Jul 28 15:02:15 2026] Bzzazzt stings Dippinsauce for 330 points of damage.",
  "[Tue Jul 28 15:02:15 2026] Eckson slashes Splitpaw Sentry for 45 points of damage. (Critical)",
  "[Tue Jul 28 15:02:15 2026] Bravesirrobin slashes Footman of V`Zher for 36 points of damage.",
  "[Tue Jul 28 15:02:15 2026] Luld slashes a rock golem for 128 points of damage.",
  "[Tue Jul 28 15:02:15 2026] Kabann slashes Innoruuk, the Prince of Hate for 43 points of damage.",
]
counterexamples = [
  "[Tue Jul 28 15:02:15 2026] Vhenwheel hit an armadillo for 4 points of magic damage by Lifetap.",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }
# Critical / Riposte / Rampage / Strikethrough / Slay Undead / Finishing Blow /
# Crippling Blow / Double Bow Shot, and combinations of them. Left as a free
# string: enumerating the set here would be an assumption the log does not
# license, and a new one shipping in a patch must not drop the line.
flag = { from = "flag", as = "str" }
# Was captured by the pattern but never exposed here -- every landed
# melee swing silently fell back to a single generic "Melee" ability
# bucket (`Ingest::canonical_melee_ability`'s own default arm) instead of
# "Punch"/"Slash"/"Kick"/etc, real per-verb tracking never actually ran.
verb = { from = "verb", as = "str" }

[[rule]]
id = "melee.miss"
kind = "miss"
priority = 30
anchors = ["but miss"]
# Trailing "(Riposte)"/"(Rampage)"/"(Flurry)"/"(Wild Rampage)" -- a special
# attack type can trigger on a swing that still misses, same as a landed
# one. The bare `!$` anchor used to hard-require nothing follow it at all,
# so all 5,022 real flagged misses fell straight through to unmatched
# entirely, not even counted as a plain miss -- see `melee.hit`'s own
# `flag` field for the precedent this mirrors.
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?P<dst>.+?), but miss(?:es)?!(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Abes tries to slash Bouncer Krik, but misses!",
  "[Tue Jul 28 15:02:15 2026] Bravesirrobin tries to slash Footman of V`Zher, but misses!",
  "[Fri Aug 07 00:00:07 2026] Socho Darkpaw tries to hit Bravesirrobin, but misses! (Riposte)",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
verb = { from = "verb", as = "str" }
flag = { from = "flag", as = "str" }

[[rule]]
id = "melee.blocked"
kind = "block"
priority = 30
anchors = ["blocks!"]
# Same swing-attempt shape as melee.miss, but the target actively avoided
# it -- kept as its own kind so a per-source accuracy breakdown can say
# "blocked" rather than lumping it in with a plain miss. `blocker` is
# expected to equal `dst` (the target blocking its own attacker); captured
# as a separate group rather than a backreference since this engine's
# regex has none. Trailing flag same as melee.miss's own note.
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?P<dst>.+?), but (?P<blocker>.+?) block(?:s)?!(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Refuse tries to punch Refugee Splitpaw, but Refugee Splitpaw blocks!",
  "[Tue Jul 28 15:02:15 2026] Refuse tries to kick Refugee Splitpaw, but Refugee Splitpaw blocks!",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
verb = { from = "verb", as = "str" }
flag = { from = "flag", as = "str" }

[[rule]]
id = "melee.dodged"
kind = "block"
priority = 30
anchors = ["dodge"]
# Same shape as melee.blocked, different avoidance type. "dodges" (3rd
# person) and "dodge" (the "YOU dodge!"/self form) both appear for real --
# same tr(?:ies|y) split covers the attacker's own conjugation already.
# Trailing flag same as melee.miss's own note.
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?P<dst>.+?), but (?P<dodger>.+?) dodges?!(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Ice boned skeleton tries to punch YOU, but YOU dodge!",
  "[Tue Jul 28 15:02:15 2026] Baron Telyx V`Zher tries to slash YOU, but YOU dodge!",
  "[Tue Jul 28 15:02:15 2026] A leering gargoyle tries to hit Bravesirrobin, but Bravesirrobin dodges!",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
verb = { from = "verb", as = "str" }
flag = { from = "flag", as = "str" }

[[rule]]
id = "melee.parried"
kind = "block"
priority = 30
anchors = ["parr"]
# Same shape as melee.blocked/melee.dodged, the 4th real avoidance type.
# Trailing flag same as melee.miss's own note. `parries|parry` -- the
# 2nd-person form is "YOU parry!" not "YOU parries!" (157 real
# occurrences of the YOU form missed entirely before this), same
# distinction melee.dodged's own `dodges?` already made; anchor
# loosened from the literal "parries!" to "parr" since "parry!" alone
# doesn't contain that substring.
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?P<dst>.+?), but (?P<parrier>.+?) (?:parries|parry)!(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] a rattlesnake tries to bite Kabn, but Kabn parries!",
  "[Tue Jul 28 15:02:15 2026] a rattlesnake tries to slash Vonektik, but Vonektik parries!",
  "[Fri Aug 07 22:11:54 2026] Orc centurion tries to cleave YOU, but YOU parry!",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
flag = { from = "flag", as = "str" }
verb = { from = "verb", as = "str" }

[[rule]]
id = "melee.riposted"
kind = "block"
priority = 30
anchors = ["riposte"]
# Same shape as melee.blocked/melee.dodged/melee.parried -- the real 5th
# avoidance type (melee.parried's own "4th" note was written before this
# one was found; 231 real occurrences in the reference log). `ripostes|
# riposte` for the same 2nd-person-verb reason melee.parried's own doc
# gives ("YOU riposte!" not "YOU ripostes!") -- unconfirmed in this
# specific log (0 real occurrences of the YOU form found), kept anyway
# since it's the same real grammatical rule the other 3 avoidance types
# already need, not a guess at new content.
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?P<dst>.+?), but (?P<riposter>.+?) (?:ripostes|riposte)!(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Wed Jul 29 20:19:55 2026] A Teir`Dal ranger tries to slash Kaeus, but Kaeus ripostes!",
  "[Wed Jul 29 20:29:09 2026] A Teir`Dal rogue tries to pierce Bravesirrobin, but Bravesirrobin ripostes!",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
flag = { from = "flag", as = "str" }
verb = { from = "verb", as = "str" }

[[rule]]
id = "taunt.captured"
kind = "taunt"
priority = 30
anchors = ["has captured "]
# why: a full taunt success -- target's own name always ends "'s
# attention!" in the real log, no bare-plural edge case found (checked).
pattern = '''^(?P<src>.+?) has captured (?P<dst>.+?)'s attention!$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Gnommie has captured a dune spiderling's attention!",
  "[Tue Jul 28 15:02:15 2026] Bravesirrobin has captured a gnoll pet's attention!",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }

[[rule]]
id = "taunt.partial"
kind = "taunt"
priority = 30
anchors = ["was partially successful in capturing"]
pattern = '''^(?P<src>.+?) was partially successful in capturing (?P<dst>.+?)'s attention\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Lebtik was partially successful in capturing a young puma's attention.",
  "[Tue Jul 28 15:02:15 2026] Morbes was partially successful in capturing Lady Shae's attention.",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }

[[rule]]
id = "taunt.failed"
kind = "taunt"
priority = 30
anchors = [" failed to taunt "]
pattern = '''^(?P<src>.+?) failed to taunt (?P<dst>.+?)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Gnommie failed to taunt a young puma.",
  "[Tue Jul 28 15:02:15 2026] Yawgmoth failed to taunt a dune spiderling.",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }

[[rule]]
id = "spell.damage"
kind = "damage"
priority = 40
anchors = [" damage by "]
pattern = '''^(?P<src>.+?) hit (?P<dst>.+?) for (?P<amt>[0-9,]+) points of (?P<dtype>[a-z]+) damage by (?P<spell>.+?)\.(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Vhenwheel hit an armadillo for 4 points of magic damage by Lifetap.",
  "[Tue Jul 28 15:02:15 2026] You hit a fragile pet for 3 points of fire damage by Burst of Flame.",
  "[Tue Jul 28 15:02:15 2026] a rattlesnake hit you for 3 points of poison damage by Feeble Poison.",
  "[Tue Jul 28 15:02:15 2026] Vhenwheel hit an armadillo for 8 points of magic damage by Lifetap. (Critical)",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }
dtype = { from = "dtype", as = "str" }
spell = { from = "spell", as = "str" }
# Same free-string flag as melee.hit -- nukes crit too, and the log marks it
# the same way, trailing the line rather than changing its shape.
flag = { from = "flag", as = "str" }

[[rule]]
id = "dot.damage"
kind = "damage"
priority = 40
anchors = [" damage from "]
# "has" and "have": first person is "You have taken", and anchoring on "has"
# alone silently dropped every incoming DoT tick on the player.
pattern = '''^(?P<dst>.+?) ha[sv]e? taken (?P<amt>[0-9,]+) damage from (?P<spell>.+?) by (?P<src>.+?)\.(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Mileena has taken 2 damage from Flame Lick by Gash Flockwalker.",
  "[Tue Jul 28 15:02:15 2026] You have taken 1 damage from Rabies by a greater mummy.",
  "[Tue Jul 28 15:02:15 2026] You have taken 29 damage from Searing Arrow by Gynok Moltor pet.",
  "[Tue Jul 28 15:02:15 2026] Mileena has taken 4 damage from Flame Lick by Gash Flockwalker. (Critical)",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }
spell = { from = "spell", as = "str" }
flag = { from = "flag", as = "str" }

[[rule]]
id = "ds.damage"
kind = "damage"
priority = 40
anchors = ["of non-melee damage"]
# why: `points?` -- same real singular/plural gap melee.hit's own doc
# already found and fixed ("1 point of damage" vs "N points"), just
# never carried over here. 905 real singular occurrences confirmed.
pattern = '''^(?P<dst>.+?) is (?P<verb>[a-z]+) by (?P<src>.+?) for (?P<amt>[0-9,]+) points? of non-melee damage\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Kaeus is burned by Tranixx Darkpaw's flames for 6 points of non-melee damage.",
  "[Tue Jul 28 15:02:15 2026] Master Brewer is pierced by Bravesirrobin's thorns for 3 points of non-melee damage.",
  "[Tue Jul 28 15:02:15 2026] A seafury cyclops is pierced by YOUR thorns for 29 points of non-melee damage.",
  "[Tue Jul 28 15:02:15 2026] Tranixx Darkpaw is pierced by Taddy's thorns for 1 point of non-melee damage.",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }

[[rule]]
id = "damage.non_melee_self"
kind = "damage"
priority = 40
anchors = ["were hit by non-melee"]
# why: a real, distinct shape from ds.damage above -- no source, no
# spell name, always "You" (288 real occurrences), contradicting this
# pack's own long-standing header note ("There is no 'was hit by
# non-melee' line at all in EQL") -- that claim was wrong, confirmed
# directly against the reference log.
pattern = '''^You were hit by non-melee for (?P<amt>[0-9,]+) damage\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You were hit by non-melee for 1 damage."]
[rule.fields]
amount = { from = "amt", as = "u64" }

[[rule]]
id = "damage.fall_self"
kind = "damage"
priority = 40
anchors = ["YOU were injured by falling"]
pattern = '''^YOU were injured by falling\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] YOU were injured by falling."]

[[rule]]
id = "damage.fall_other"
kind = "damage"
priority = 40
anchors = [" was injured by falling"]
pattern = '''^(?P<who>.+?) was injured by falling\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Govtcheeze was injured by falling."]
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "mobstate.magical_skin_absorbs"
kind = "mobstate"
priority = 20
anchors = ["'s magical skin absorbs the damage of "]
pattern = '''^(?P<who>.+?)'s magical skin absorbs the damage of (?P<source>.+?)'s (?:flames|thorns)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Kahaptra Z`Taj's magical skin absorbs the damage of Bravesirrobin's thorns.",
  "[Tue Jul 28 15:02:15 2026] Konarer's magical skin absorbs the damage of Nisch Val Torash Mashk's flames.",
]
[rule.fields]
who = { from = "who", as = "str" }
source = { from = "source", as = "str" }

[[rule]]
id = "melee.magical_skin_absorbed"
kind = "block"
priority = 30
anchors = ["magical skin absorbs the blow!"]
# why: not one of the real 4 avoidance types (block/dodge/parry/riposte)
# -- a magical damage-absorb, not a defender's own evasion skill -- but
# same "attack landed, no damage got through" bucket, same reason
# ds.damage's own kind groups a damage-shield's damage with plain hits.
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?P<dst>.+?), but (?P<dst2>.+?)'s magical skin absorbs the blow!$'''
examples = ["[Tue Jul 28 15:02:15 2026] Bravesirrobin tries to hit Kahaptra Z`Taj, but Kahaptra Z`Taj's magical skin absorbs the blow!"]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
verb = { from = "verb", as = "str" }

[[rule]]
id = "mobstate.staggers_hazard"
kind = "mobstate"
priority = 20
anchors = [" slams "]
# why: a trap/environmental proc, not mob.state's own fixed-alternation
# shape -- the hazard itself varies (only 2 real values found: "dagger
# of frost"/"frost shard"), so it needs its own capture instead of a
# literal alternative there. `who` covers both self ("You"/"YOU") and
# third-person the same lazy way mob.state's own `who` does.
pattern = '''^(?P<who>.+?) stagger(?:s)? as a (?P<hazard>dagger of frost|frost shard) slams (?:into|against) (?:them|you)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Bravesirrobin staggers as a dagger of frost slams into them.",
  "[Tue Jul 28 15:02:15 2026] You stagger as a dagger of frost slams into you.",
  "[Tue Jul 28 15:02:15 2026] Balanque staggers as a frost shard slams against them.",
]
[rule.fields]
who = { from = "who", as = "str" }
hazard = { from = "hazard", as = "str" }

# ============================================================ healing

[[rule]]
id = "heal.by_spell"
kind = "heal"
priority = 40
anchors = ["hit points by "]
# why: two real additions -- an optional " over time" clause (a HoT
# tick, same shape otherwise) and an optional trailing "(Flag)" clause
# (real: "(Critical)"), same trailing-flag treatment melee.hit's own
# `flag` field already gets. Neither was here before, so every HoT tick
# and every critical direct heal both fell through to unmatched.
pattern = '''^(?P<src>.+?) healed (?P<dst>.+?)(?: over time)? for (?P<amt>[0-9,]+)(?: \((?P<uncapped>[0-9,]+)\))? hit points by (?P<spell>.+?)\.(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Mairin healed himself for 5 hit points by Lifetap.",
  "[Tue Jul 28 15:02:15 2026] Rammu healed himself for 2 hit points by Blessing of the Squire.",
  "[Tue Jul 28 15:02:15 2026] Vhenwheel healed himself for 0 (4) hit points by Lifetap.",
  "[Tue Jul 28 15:02:15 2026] Geloe healed herself for 14 hit points by Minor Healing.",
  "[Tue Jul 28 15:02:15 2026] Lebtik healed itself for 4 hit points by Lifetap.",
  "[Tue Jul 28 15:02:15 2026] Bravesirrobin healed you over time for 31 hit points by Sprouting Heal.",
  "[Tue Jul 28 15:02:15 2026] Bravesirrobin healed Zibektik over time for 122 hit points by Flowering Heal. (Critical)",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }
flag = { from = "flag", as = "str" }
uncapped = { from = "uncapped", as = "u64" }
spell = { from = "spell", as = "str" }

[[rule]]
id = "heal.plain"
kind = "heal"
priority = 30
anchors = [" hit points."]
excludes = ["hit points by "]
pattern = '''^(?P<src>.+?) healed (?P<dst>.+?) for (?P<amt>[0-9,]+)(?: \((?P<uncapped>[0-9,]+)\))? hit points\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Dippinsauce healed you for 40 hit points.",
  "[Tue Jul 28 15:02:15 2026] Ikao healed Jaded for 10 hit points.",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }

