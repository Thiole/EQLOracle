  "[Tue Jul 28 15:02:15 2026] You have taken 1 damage from Rabies by a greater mummy.",
  "[Tue Jul 28 15:02:15 2026] You have taken 29 damage from Searing Arrow by Gynok Moltor pet.",
  "[Tue Jul 28 15:02:15 2026] Mileena has taken 4 damage from Flame Lick by Gash Flockwalker. (Critical)",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }
spell = { from = "spell", as = "str" }
flag = { from = "flag", as = "str" }

[[rule]]
id = "ds.damage"
kind = "damage"
priority = 40
anchors = ["of non-melee damage"]
# why: `points?` -- same real singular/plural gap melee.hit's own doc
# already found and fixed ("1 point of damage" vs "N points"), just
# never carried over here. 905 real singular occurrences confirmed.
# why is|are and .|! -- the 2nd-person "YOU are burned/pierced by ...!"
# form (self as target, exclamation) is a real, separate client message
# from the 3rd-person "X is burned/pierced by ...." form, not a typo of
# it -- tens of thousands of real occurrences confirmed, previously unmatched.
pattern = '''^(?P<dst>.+?) (?:is|are) (?P<verb>[a-z]+) by (?P<src>.+?) for (?P<amt>[0-9,]+) points? of non-melee damage[.!]$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Kaeus is burned by Tranixx Darkpaw's flames for 6 points of non-melee damage.",
  "[Tue Jul 28 15:02:15 2026] Master Brewer is pierced by Bravesirrobin's thorns for 3 points of non-melee damage.",
  "[Tue Jul 28 15:02:15 2026] A seafury cyclops is pierced by YOUR thorns for 29 points of non-melee damage.",
  "[Tue Jul 28 15:02:15 2026] Tranixx Darkpaw is pierced by Taddy's thorns for 1 point of non-melee damage.",
  "[Tue Jul 28 15:02:15 2026] YOU are pierced by an ire ghast's thorns for 18 points of non-melee damage!",
  "[Tue Jul 28 15:02:15 2026] YOU are burned by a Pickclaw Arroweater's flames for 7 points of non-melee damage!",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }

[[rule]]
id = "damage.non_melee_self"
kind = "damage"
priority = 40
anchors = ["were hit by non-melee"]
# why: a real, distinct shape from ds.damage above -- no source, no
# spell name, always "You" (288 real occurrences), contradicting this
# pack's own long-standing header note ("There is no 'was hit by
# non-melee' line at all in EQL") -- that claim was wrong, confirmed
# directly against the reference log.
pattern = '''^You were hit by non-melee for (?P<amt>[0-9,]+) damage\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You were hit by non-melee for 1 damage."]
[rule.fields]
amount = { from = "amt", as = "u64" }

[[rule]]
id = "damage.fall_self"
