# EverQuest Legends rule pack.
#
# Every pattern here was derived from an actual 1.83M-line log
# (eqlog_Manipulator_rivervale.txt, Jul 28 - Aug 09 2026) via `eqlp shapes`.
# No line format in this file is guessed. Where classic-EQ intuition and the
# log disagreed, the log won -- notably:
#
#   * XP is "You gain experience! (11.000%)", not the classic "experience!!",
#     and it carries a percentage.
#   * Spell damage is "<src> hit <dst> for N points of <type> damage by
#     <spell>." A bare, sourceless "You were hit by non-melee for N
#     damage." also exists for real (288 occurrences, see
#     damage.non_melee_self) -- an earlier version of this note claimed
#     no such line existed at all; that was wrong.
#   * Heals are "<src> healed <dst> for N hit points by <spell>.", with an
#     optional "(M)" giving the uncapped amount.
#   * Loot names the corpse: "--You have looted a X from a Y's corpse.--"
#
# Regenerate the backlog after any patch with:
#   eqlp coverage --pack packs/eql.toml yourlog.txt --top 40

name = "eql"
version = 1
header = "bracket-ctime"

# ============================================================ chat
# High priority: chat text can contain literally any other line as a quote,
# so these must win before combat rules get a look.

[[rule]]
id = "chat.channel"
kind = "chat"
priority = 100
anchors = [" tells "]
pattern = '''^(?P<who>.+?) tells (?P<chan>[A-Za-z0-9_]+):(?P<num>[0-9]+), '(?P<text>.*)'$'''
examples = ["[Tue Jul 28 15:02:15 2026] Moosey tells NewPlayers:1, 'sneak is critical to most spell acquisition at this point'"]
# Was captured by the pattern but never exposed here -- `extract_action`'s
# "chat.channel" arm reads `who` to build `Action::PlayerProof`, but with
# no `[rule.fields]` block at all every field lookup silently returned
# `Value::Missing`, so this rule could never actually prove a player via
# a numbered channel -- confirmed directly (not assumed): a debug probe
# showed the rule matching correctly but `str_field("who")` still `None`.
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "chat.directed"
kind = "chat"
priority = 90
anchors = ["'"]
pattern = '''^(?P<who>.+?) (?P<chan>tells you|tells the guild|tells the group|tell your party|tell the guild|tell the group|says out of character|say out of character|auctions|auction|shouts|shout|says|say), '(?P<text>.*)'$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Kaeus tells you, 'I'm busy right now.'",
  "[Tue Jul 28 15:02:15 2026] You tell your party, 'yo'",
  "[Tue Jul 28 15:02:15 2026] Honeybadger says out of character, 'where can i buy pet supplies'",
  "[Tue Jul 28 15:02:15 2026] Biscuits auctions, 'wtb thumper +4'",
  "[Tue Jul 28 15:02:15 2026] You say, 'send'",
  "[Tue Jul 28 15:02:15 2026] Dead Doug says, 'Ahh Dougrick, I knew him well'",
]
# Same real, previously-undiscovered gap as "chat.channel" above -- no
# `[rule.fields]` block meant `extract_action`'s "chat.directed" arm could
# never actually read `who`/`chan`, so `Action::PlayerProof` (the whole
# chat-proof half of ally detection, `Entities::note_player_channel`) was
# silently dead code this entire project's history -- confirmed via a
# direct debug probe against a real matched line, not assumed from reading
# the code.
[rule.fields]
who = { from = "who", as = "str" }
chan = { from = "chan", as = "str" }

# ============================================================ combat

[[rule]]
id = "melee.hit"
kind = "damage"
priority = 30
# Anchor is " of damage." rather than "points of damage." because 30,164 lines
# in the reference log use the singular "1 point of damage" -- anchoring on
# the plural silently dropped every one of them.
anchors = [" of damage."]
pattern = '''^(?P<src>.+?) (?P<verb>slashes|slash|bashes|bash|kicks|kick|hits|hit|cleaves|cleave|punches|punch|crushes|crush|pierces|pierce|strikes|strike|bites|bite|frenzies|frenzy|backstabs|backstab|reaves|reave|smites|smite|shoots|shoot|slices|slice|claws|claw|smashes|smash|mauls|maul|gores|gore) (?P<dst>.+?) for (?P<amt>[0-9,]+) points? of damage\.(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Bouncer Krik slashes Beba for 59 points of damage.",
  "[Tue Jul 28 15:02:15 2026] Morbes bashes Pandos Flintside for 1 point of damage.",
  "[Tue Jul 28 15:02:15 2026] Eckson slashes Splitpaw Sentry for 45 points of damage. (Critical)",
  "[Tue Jul 28 15:02:15 2026] Bravesirrobin slashes Footman of V`Zher for 36 points of damage.",
  "[Tue Jul 28 15:02:15 2026] Luld slashes a rock golem for 128 points of damage.",
  "[Tue Jul 28 15:02:15 2026] Kabann slashes Innoruuk, the Prince of Hate for 43 points of damage.",
]
counterexamples = [
  "[Tue Jul 28 15:02:15 2026] Vhenwheel hit an armadillo for 4 points of magic damage by Lifetap.",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }
# Critical / Riposte / Rampage / Strikethrough / Slay Undead / Finishing Blow /
# Crippling Blow / Double Bow Shot, and combinations of them. Left as a free
# string: enumerating the set here would be an assumption the log does not
# license, and a new one shipping in a patch must not drop the line.
flag = { from = "flag", as = "str" }
# Was captured by the pattern but never exposed here -- every landed
# melee swing silently fell back to a single generic "Melee" ability
# bucket (`Ingest::canonical_melee_ability`'s own default arm) instead of
# "Punch"/"Slash"/"Kick"/etc, real per-verb tracking never actually ran.
verb = { from = "verb", as = "str" }

[[rule]]
id = "melee.miss"
kind = "miss"
priority = 30
anchors = ["but miss"]
# Trailing "(Riposte)"/"(Rampage)"/"(Flurry)"/"(Wild Rampage)" -- a special
# attack type can trigger on a swing that still misses, same as a landed
# one. The bare `!$` anchor used to hard-require nothing follow it at all,
# so all 5,022 real flagged misses fell straight through to unmatched
# entirely, not even counted as a plain miss -- see `melee.hit`'s own
# `flag` field for the precedent this mirrors.
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?P<dst>.+?), but miss(?:es)?!(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Abes tries to slash Bouncer Krik, but misses!",
  "[Tue Jul 28 15:02:15 2026] Bravesirrobin tries to slash Footman of V`Zher, but misses!",
  "[Fri Aug 07 00:00:07 2026] Socho Darkpaw tries to hit Bravesirrobin, but misses! (Riposte)",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
verb = { from = "verb", as = "str" }
flag = { from = "flag", as = "str" }

[[rule]]
id = "melee.blocked"
kind = "block"
priority = 30
anchors = ["blocks!"]
# Same swing-attempt shape as melee.miss, but the target actively avoided
# it -- kept as its own kind so a per-source accuracy breakdown can say
# "blocked" rather than lumping it in with a plain miss. `blocker` is
# expected to equal `dst` (the target blocking its own attacker); captured
# as a separate group rather than a backreference since this engine's
# regex has none. Trailing flag same as melee.miss's own note.
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?P<dst>.+?), but (?P<blocker>.+?) block(?:s)?!(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Refuse tries to punch Refugee Splitpaw, but Refugee Splitpaw blocks!",
  "[Tue Jul 28 15:02:15 2026] Refuse tries to kick Refugee Splitpaw, but Refugee Splitpaw blocks!",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
verb = { from = "verb", as = "str" }
flag = { from = "flag", as = "str" }

[[rule]]
id = "melee.dodged"
kind = "block"
priority = 30
anchors = ["dodge"]
# Same shape as melee.blocked, different avoidance type. "dodges" (3rd
# person) and "dodge" (the "YOU dodge!"/self form) both appear for real --
# same tr(?:ies|y) split covers the attacker's own conjugation already.
# Trailing flag same as melee.miss's own note.
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?P<dst>.+?), but (?P<dodger>.+?) dodges?!(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Ice boned skeleton tries to punch YOU, but YOU dodge!",
  "[Tue Jul 28 15:02:15 2026] Baron Telyx V`Zher tries to slash YOU, but YOU dodge!",
  "[Tue Jul 28 15:02:15 2026] A leering gargoyle tries to hit Bravesirrobin, but Bravesirrobin dodges!",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
verb = { from = "verb", as = "str" }
flag = { from = "flag", as = "str" }

[[rule]]
id = "melee.parried"
kind = "block"
priority = 30
anchors = ["parries!"]
# Same shape as melee.blocked/melee.dodged, the 4th real avoidance type.
# Trailing flag same as melee.miss's own note.
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?P<dst>.+?), but (?P<parrier>.+?) parries!(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] a rattlesnake tries to bite Kabn, but Kabn parries!",
  "[Tue Jul 28 15:02:15 2026] a rattlesnake tries to slash Vonektik, but Vonektik parries!",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
flag = { from = "flag", as = "str" }
verb = { from = "verb", as = "str" }

[[rule]]
id = "melee.riposted"
kind = "block"
priority = 30
anchors = ["ripostes!"]
# Same shape as melee.blocked/melee.dodged/melee.parried -- the real 5th
# avoidance type (melee.parried's own "4th" note was written before this
# one was found; 231 real occurrences in the reference log).
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?P<dst>.+?), but (?P<riposter>.+?) ripostes!(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Wed Jul 29 20:19:55 2026] A Teir`Dal ranger tries to slash Kaeus, but Kaeus ripostes!",
  "[Wed Jul 29 20:29:09 2026] A Teir`Dal rogue tries to pierce Bravesirrobin, but Bravesirrobin ripostes!",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
flag = { from = "flag", as = "str" }
verb = { from = "verb", as = "str" }

[[rule]]
id = "taunt.captured"
kind = "taunt"
priority = 30
anchors = ["has captured "]
# why: a full taunt success -- target's own name always ends "'s
# attention!" in the real log, no bare-plural edge case found (checked).
pattern = '''^(?P<src>.+?) has captured (?P<dst>.+?)'s attention!$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Gnommie has captured a dune spiderling's attention!",
  "[Tue Jul 28 15:02:15 2026] Bravesirrobin has captured a gnoll pet's attention!",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }

[[rule]]
id = "taunt.partial"
kind = "taunt"
priority = 30
anchors = ["was partially successful in capturing"]
pattern = '''^(?P<src>.+?) was partially successful in capturing (?P<dst>.+?)'s attention\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Lebtik was partially successful in capturing a young puma's attention.",
  "[Tue Jul 28 15:02:15 2026] Morbes was partially successful in capturing Lady Shae's attention.",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }

[[rule]]
id = "taunt.failed"
kind = "taunt"
priority = 30
anchors = [" failed to taunt "]
pattern = '''^(?P<src>.+?) failed to taunt (?P<dst>.+?)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Gnommie failed to taunt a young puma.",
  "[Tue Jul 28 15:02:15 2026] Yawgmoth failed to taunt a dune spiderling.",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }

[[rule]]
id = "spell.damage"
kind = "damage"
priority = 40
anchors = [" damage by "]
pattern = '''^(?P<src>.+?) hit (?P<dst>.+?) for (?P<amt>[0-9,]+) points of (?P<dtype>[a-z]+) damage by (?P<spell>.+?)\.(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Vhenwheel hit an armadillo for 4 points of magic damage by Lifetap.",
  "[Tue Jul 28 15:02:15 2026] You hit a fragile pet for 3 points of fire damage by Burst of Flame.",
  "[Tue Jul 28 15:02:15 2026] a rattlesnake hit you for 3 points of poison damage by Feeble Poison.",
  "[Tue Jul 28 15:02:15 2026] Vhenwheel hit an armadillo for 8 points of magic damage by Lifetap. (Critical)",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }
dtype = { from = "dtype", as = "str" }
spell = { from = "spell", as = "str" }
# Same free-string flag as melee.hit -- nukes crit too, and the log marks it
# the same way, trailing the line rather than changing its shape.
flag = { from = "flag", as = "str" }

[[rule]]
id = "dot.damage"
kind = "damage"
priority = 40
anchors = [" damage from "]
# "has" and "have": first person is "You have taken", and anchoring on "has"
# alone silently dropped every incoming DoT tick on the player.
pattern = '''^(?P<dst>.+?) ha[sv]e? taken (?P<amt>[0-9,]+) damage from (?P<spell>.+?) by (?P<src>.+?)\.(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Mileena has taken 2 damage from Flame Lick by Gash Flockwalker.",
  "[Tue Jul 28 15:02:15 2026] You have taken 1 damage from Rabies by a greater mummy.",
  "[Tue Jul 28 15:02:15 2026] You have taken 29 damage from Searing Arrow by Gynok Moltor pet.",
  "[Tue Jul 28 15:02:15 2026] Mileena has taken 4 damage from Flame Lick by Gash Flockwalker. (Critical)",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }
spell = { from = "spell", as = "str" }
flag = { from = "flag", as = "str" }

[[rule]]
id = "ds.damage"
kind = "damage"
priority = 40
anchors = ["points of non-melee damage"]
pattern = '''^(?P<dst>.+?) is (?P<verb>[a-z]+) by (?P<src>.+?) for (?P<amt>[0-9,]+) points of non-melee damage\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Kaeus is burned by Tranixx Darkpaw's flames for 6 points of non-melee damage.",
  "[Tue Jul 28 15:02:15 2026] Master Brewer is pierced by Bravesirrobin's thorns for 3 points of non-melee damage.",
  "[Tue Jul 28 15:02:15 2026] A seafury cyclops is pierced by YOUR thorns for 29 points of non-melee damage.",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }

[[rule]]
id = "damage.non_melee_self"
kind = "damage"
priority = 40
anchors = ["were hit by non-melee"]
# why: a real, distinct shape from ds.damage above -- no source, no
# spell name, always "You" (288 real occurrences), contradicting this
# pack's own long-standing header note ("There is no 'was hit by
# non-melee' line at all in EQL") -- that claim was wrong, confirmed
# directly against the reference log.
pattern = '''^You were hit by non-melee for (?P<amt>[0-9,]+) damage\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You were hit by non-melee for 1 damage."]
[rule.fields]
amount = { from = "amt", as = "u64" }

# ============================================================ healing

[[rule]]
id = "heal.by_spell"
kind = "heal"
priority = 40
anchors = ["hit points by "]
pattern = '''^(?P<src>.+?) healed (?P<dst>.+?) for (?P<amt>[0-9,]+)(?: \((?P<uncapped>[0-9,]+)\))? hit points by (?P<spell>.+?)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Mairin healed himself for 5 hit points by Lifetap.",
  "[Tue Jul 28 15:02:15 2026] Rammu healed himself for 2 hit points by Blessing of the Squire.",
  "[Tue Jul 28 15:02:15 2026] Vhenwheel healed himself for 0 (4) hit points by Lifetap.",
  "[Tue Jul 28 15:02:15 2026] Geloe healed herself for 14 hit points by Minor Healing.",
  "[Tue Jul 28 15:02:15 2026] Lebtik healed itself for 4 hit points by Lifetap.",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }
uncapped = { from = "uncapped", as = "u64" }
spell = { from = "spell", as = "str" }

[[rule]]
id = "heal.plain"
kind = "heal"
priority = 30
anchors = [" hit points."]
excludes = ["hit points by "]
pattern = '''^(?P<src>.+?) healed (?P<dst>.+?) for (?P<amt>[0-9,]+)(?: \((?P<uncapped>[0-9,]+)\))? hit points\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Dippinsauce healed you for 40 hit points.",
  "[Tue Jul 28 15:02:15 2026] Ikao healed Jaded for 10 hit points.",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }

# ============================================================ casting

[[rule]]
id = "cast.begin"
kind = "cast"
priority = 30
anchors = ["casting "]
pattern = '''^(?P<src>.+?) begins? casting (?P<spell>.+?)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Vhenwheel begins casting Cavorting Bones.",
  "[Tue Jul 28 15:02:15 2026] You begin casting Garrison's Mighty Mana Shock X.",
]
[rule.fields]
source = { from = "src", as = "str" }
spell = { from = "spell", as = "str" }

[[rule]]
id = "sing.begin"
kind = "cast"
priority = 30
anchors = ["singing "]
pattern = '''^(?P<src>.+?) begins? singing (?P<song>.+?)\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Murgledoo begins singing Chords of Dissonance."]
[rule.fields]
source = { from = "src", as = "str" }
song = { from = "song", as = "str" }

[[rule]]
id = "spell.memorize_start"
kind = "spell"
priority = 30
anchors = ["Beginning to memorize"]
pattern = '''^Beginning to memorize (?P<spell>.+?)\.\.\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Beginning to memorize Color Flux..."]
[rule.fields]
spell = { from = "spell", as = "str" }

[[rule]]
id = "spell.memorize_done"
kind = "spell"
priority = 30
anchors = ["finished memorizing"]
pattern = '''^You have finished memorizing (?P<spell>.+?)\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You have finished memorizing Color Flux."]
[rule.fields]
spell = { from = "spell", as = "str" }

[[rule]]
id = "spell.scribe_start"
kind = "spell"
priority = 30
# The real "added to spellbook" event -- confirmed against the reference
# log (596 occurrences), superseding an earlier assumption in this pack
# that no such line existed. See `ingest::SpellLog`'s own doc for how
# this pairs with spell.scribe_done to distinguish "known" (finished) from
# "possible" (began, never confirmed finished).
anchors = ["Beginning to scribe"]
pattern = '''^Beginning to scribe (?P<spell>.+?)\.\.\.$'''
examples = ["[Wed Jul 29 17:02:20 2026] Beginning to scribe Project Lightning..."]
[rule.fields]
spell = { from = "spell", as = "str" }

[[rule]]
id = "spell.scribe_done"
kind = "spell"
priority = 30
anchors = ["finished scribing"]
pattern = '''^You have finished scribing (?P<spell>.+?)\.$'''
examples = ["[Wed Jul 29 17:02:20 2026] You have finished scribing Project Lightning."]
[rule.fields]
spell = { from = "spell", as = "str" }

[[rule]]
id = "spell.forget"
kind = "spell"
priority = 30
anchors = ["You forget "]
pattern = '''^You forget (?P<spell>.+?)\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You forget Juli's Animation."]

# ============================================================ death

[[rule]]
id = "death.you_slew"
kind = "death"
priority = 50
anchors = ["You have slain"]
pattern = '''^You have slain (?P<victim>.+?)!$'''
examples = ["[Tue Jul 28 15:02:15 2026] You have slain a fragile pet!"]
[rule.fields]
victim = { from = "victim", as = "str" }

[[rule]]
id = "death.you_died"
kind = "death"
priority = 50
anchors = ["You have been slain by"]
pattern = '''^You have been slain by (?P<killer>.+?)!$'''
examples = ["[Tue Jul 28 15:02:15 2026] You have been slain by Guard Fintran!"]
[rule.fields]
killer = { from = "killer", as = "str" }

[[rule]]
id = "death.other"
kind = "death"
priority = 40
anchors = ["has been slain by"]
excludes = ["You have been slain by"]
pattern = '''^(?P<victim>.+?) has been slain by (?P<killer>.+?)!$'''
examples = ["[Tue Jul 28 15:02:15 2026] An armadillo has been slain by Vhenwheel!"]
[rule.fields]
victim = { from = "victim", as = "str" }
killer = { from = "killer", as = "str" }

[[rule]]
id = "death.plain"
kind = "death"
priority = 30
anchors = [" died."]
pattern = '''^(?P<victim>.+?) died\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Dippinsauce died."]
[rule.fields]
victim = { from = "victim", as = "str" }

# ============================================================ progression

[[rule]]
id = "xp.gain"
kind = "xp"
priority = 40
anchors = ["experience!"]
pattern = '''^You gain (?P<scope>party |group |raid |)experience! \((?P<pct>[0-9.]+)%\)$'''
examples = ["[Tue Jul 28 15:02:15 2026] You gain experience! (11.000%)"]
[rule.fields]
scope = { from = "scope", as = "str" }
pct = { from = "pct", as = "f64" }

[[rule]]
id = "level.up"
kind = "level"
priority = 50
anchors = ["Welcome to level"]
pattern = '''^You have gained a level! Welcome to level (?P<level>[0-9]+)!$'''
examples = ["[Tue Jul 28 15:02:15 2026] You have gained a level! Welcome to level 2!"]
[rule.fields]
level = { from = "level", as = "u64" }

[[rule]]
id = "afk.on"
kind = "afk"
priority = 40
anchors = ["You are now A.F.K."]
pattern = '''^You are now A\.F\.K\. \(Away From Keyboard\)\.$'''
examples = ["[Sun Aug 16 19:43:02 2026] You are now A.F.K. (Away From Keyboard)."]

[[rule]]
id = "afk.off"
kind = "afk"
priority = 40
anchors = ["You are no longer A.F.K."]
pattern = '''^You are no longer A\.F\.K\. \(Away From Keyboard\)\.$'''
examples = ["[Sun Aug 16 19:43:03 2026] You are no longer A.F.K. (Away From Keyboard)."]

[[rule]]
id = "skill.up"
kind = "skill"
priority = 40
anchors = ["become better at"]
pattern = '''^You have become better at (?P<skill>.+?)! \((?P<level>[0-9]+)\)$'''
examples = ["[Tue Jul 28 15:02:15 2026] You have become better at Meditate! (11)"]
[rule.fields]
skill = { from = "skill", as = "str" }
level = { from = "level", as = "u64" }

[[rule]]
id = "aa.gained"
kind = "aa"
priority = 40
# Rank 1 of an AA, first purchase ever -- distinct from "aa.improved"
# below (rank 2+), which uses "improved <name> <rank>" instead of a
# quoted name and has no rank-1 case of its own. Cost is "N ability
# points." even at cost 0 or 1 -- always plural here, unlike
# aa.improved's own "1 ability point." singular at exactly cost 1 --
# confirmed against the real reference log, not assumed grammar.
anchors = [" at a cost of "]
pattern = '''^You have gained the ability "(?P<name>.+?)" at a cost of (?P<cost>[0-9]+) ability points?\.$'''
examples = [
  "[Fri Aug 07 00:25:51 2026] You have gained the ability \"Unbound Drain\" at a cost of 0 ability points.",
  "[Fri Aug 07 21:00:06 2026] You have gained the ability \"Innate Regeneration\" at a cost of 1 ability points.",
  "[Fri Jul 31 16:55:33 2026] You have gained the ability \"Spell Casting Deftness\" at a cost of 2 ability points.",
]
counterexamples = [
  # Innate skill grants (Bash, Riposte, Dodge, ...) -- no quotes, no
  # cost clause, not a real AA purchase. Never matches this pattern
  # since there's nothing to fill `name`/`cost` from.
  "[Sat Aug 08 00:36:12 2026] You have gained the ability to use Double Attack.",
]
[rule.fields]
name = { from = "name", as = "str" }
cost = { from = "cost", as = "u64" }

[[rule]]
id = "aa.improved"
kind = "aa"
priority = 40
# Rank 2+ of an AA already owned -- "improved <name> <rank>", not
# "gained the ability". No AA name in the catalog ends in a digit (see
# aadata.rs's module doc), so the non-greedy `name` capture followed by
# a bare rank number never mis-splits.
anchors = [" at a cost of "]
pattern = '''^You have improved (?P<name>.+?) (?P<rank>[0-9]+) at a cost of (?P<cost>[0-9]+) ability points?\.$'''
examples = [
  "[Fri Aug 07 21:00:06 2026] You have improved Innate Regeneration 2 at a cost of 1 ability point.",
  "[Mon Aug 03 18:13:44 2026] You have improved Adamant Will 2 at a cost of 4 ability points.",
  "[Mon Aug 03 18:13:44 2026] You have improved Harm Touch 8 at a cost of 0 ability points.",
]
[rule.fields]
name = { from = "name", as = "str" }
rank = { from = "rank", as = "u64" }
cost = { from = "cost", as = "u64" }

[[rule]]
id = "faction.adjust"
kind = "faction"
priority = 40
anchors = ["faction standing with"]
pattern = '''^Your faction standing with (?P<faction>.+?) has been adjusted by (?P<delta>-?[0-9]+)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Your faction standing with Neriak Ogre has been adjusted by 5.",
  "[Tue Jul 28 15:02:15 2026] Your faction standing with Keepers of the Art has been adjusted by -20.",
]
[rule.fields]
faction = { from = "faction", as = "str" }
delta = { from = "delta", as = "i64" }

# ============================================================ items / world

[[rule]]
id = "craft.success"
kind = "craft"
priority = 50
anchors = ["fashioned the items together"]
pattern = '''^You have fashioned the items together to create something new: (?P<item>.+)\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You have fashioned the items together to create something new: Silver Malachite Ring."]
[rule.fields]
item = { from = "item", as = "str" }

[[rule]]
id = "craft.failure"
kind = "craft"
priority = 50
anchors = ["lacked the skills to fashion"]
pattern = '''^You lacked the skills to fashion (?P<item>.+)\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You lacked the skills to fashion Silver Malachite Ring."]
[rule.fields]
item = { from = "item", as = "str" }

[[rule]]
id = "craft.skill_capped"
kind = "craft"
priority = 50
anchors = ["can no longer advance your skill from making"]
pattern = '''^You can no longer advance your skill from making this item\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You can no longer advance your skill from making this item."]

[[rule]]
id = "loot.self"
kind = "loot"
priority = 50
anchors = ["You have looted"]
# A stack loots as "You have looted 2 Bone Chips from ..." -- no article, a
# leading count instead. A single item loots as "a"/"an" with no count at
# all. `qty` only participates in the numeral branch; absent (the singular
# case) defaults to 1 in ingest.rs, the same way cast.interrupted's `who`
# only participates in its own branch and defaults to "You" there.
pattern = '''^--You have looted (?:(?P<qty>[0-9]+)|a|an) (?P<item>.+?) from (?P<corpse>.+?)\.--$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] --You have looted a Fragile Pet's Skull from a fragile pet's corpse.--",
  "[Tue Jul 28 15:02:15 2026] --You have looted 2 Bone Chips from a cracked skeleton's corpse.--",
]
[rule.fields]
qty = { from = "qty", as = "u64" }
item = { from = "item", as = "str" }
corpse = { from = "corpse", as = "str" }

[[rule]]
id = "loot.self.direct"
kind = "loot"
priority = 50
anchors = ["You looted"]
# loot.self (above) only ever matches one specific client message -- the
# "--...--" bracketed "You have looted X from Y's corpse.--" form. There
# is a second, completely different message the client also sends on an
# ordinary loot, and checked against a real long-lived log
# (eqlog_Manipulator_rivervale.txt, 2.27M lines): 7,576 lines matched this
# second form against only 546 for the first. The vast majority of real
# loot events were silently invisible to this app before this rule
# existed -- not a mis-attribution bug, a coverage gap.
#
# This second form has no "--" bracketing, says "looted" not "have
# looted", and its trailing clause varies by what happened to the item
# after: sold automatically to a vendor ("and sold it for <currency>."),
# banked as currency ("and stored it in your currency", no trailing
# period), stashed in a tradeskill depot or Dragon Hoard, or combined into
# a higher tier ("to create a <item> +N", also no trailing period). Rather
# than one rule per trailing clause (a new one needed every time the
# client adds another auto-handling option), item/corpse/qty are captured
# up through "'s corpse" and everything after that is matched but mostly
# discarded (`.*$`) -- permissive on purpose, so a trailing clause this
# session's log doesn't happen to contain still parses correctly. The one
# exception: an auto-sell's own "and sold it for <amount>" clause is
# pulled out as `sold_for` -- still just the raw denomination text
# (Ingest::parse_currency_copper does the actual parsing, same "capture
# stays a pure read" reason `corpse` isn't stripped of its "'s corpse"
# suffix here either), but naming it is what lets `record_loot` also
# record the platinum earned, not just the item.
pattern = '''^You looted (?:(?P<qty>[0-9]+)|a|an) (?P<item>.+?) from (?P<corpse>.+?'s corpse)(?: and sold it for (?P<sold_for>[^.]+))?.*$'''
examples = [
  "[Tue Jul 28 15:10:44 2026] You looted a Chunk of Meat from a coyote's corpse and sold it for 1 silver.",
  "[Tue Jul 28 15:31:55 2026] You looted a Mote of Infinitesimal Potential from a dune spiderling's corpse and stored it in your currency",
  "[Tue Jul 28 20:00:22 2026] You looted a Rusty Mace +2 from a patrolling gnoll's corpse to create a Rusty Mace +3",
  "[Tue Jul 28 15:13:00 2026] You looted 2 Deepwater Ink from a swirlspine seahorse's corpse and stored it in your tradeskill depot",
  "[Tue Jul 28 15:10:08 2026] You looted 2 Phosphorous Powder from a zol ghoul knight's corpse and sold it for 2 platinum, 5 gold, 7 silver and 2 copper.",
]
[rule.fields]
qty = { from = "qty", as = "u64" }
item = { from = "item", as = "str" }
corpse = { from = "corpse", as = "str" }
sold_for = { from = "sold_for", as = "str" }

[[rule]]
id = "money.vendor_sell"
kind = "money"
priority = 50
anchors = ["You receive"]
# A direct sale to an NPC vendor (not a loot auto-sell -- see `loot.self.
# direct`'s own `sold_for` for that one): "You receive <amount> from
# <vendor> for <item>(s)." `amount` is captured lazily up through the
# first " from " -- the denomination text itself never contains that
# substring, so this is safe regardless of how many denominations are
# present or how they're joined (confirmed against the real log: this
# server phrases the same 4-denomination list two different ways --
# "9 platinum 5 gold 7 silver" here, vs "2 platinum, 5 gold, 7 silver and
# 2 copper" on an auto-sell -- which is exactly why parsing the list's
# internal structure is left to Ingest::parse_currency_copper rather than
# encoded into this pattern).
pattern = '''^You receive (?P<amount>.+?) from .+ for .+\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] You receive 9 platinum 5 gold 7 silver from Klok Koglin for the Gold Malachite Bracelet(s).",
  "[Tue Jul 28 15:02:15 2026] You receive 70 platinum 2 gold from Canarie for the Golden Star Ruby Ring(s).",
  "[Tue Jul 28 15:02:15 2026] You receive 185 platinum from Klok Koglin for the Fire Emerald Platinum Ring(s).",
]
[rule.fields]
amount = { from = "amount", as = "str" }

[[rule]]
id = "outputfile.complete"
kind = "outputfile"
priority = 50
anchors = ["Outputfile Complete"]
# The client's own confirmation that a /outputfile command finished
# writing -- for /outputfile inventory specifically, this is the only log
# signal that a fresh inventory dump exists at all, and the only place its
# exact filename is ever stated. The dump itself lands one directory above
# Logs (the game's base install folder, see AppConfig's doc in
# eqlp-app::config), never in the log stream -- this line is a pointer to
# it, not the data itself.
pattern = '''^Outputfile Complete: (?P<file>.+)$'''
examples = [
  "[Sun Aug 16 08:24:59 2026] Outputfile Complete: Manipulator_rivervale-Inventory.txt",
]
[rule.fields]
file = { from = "file", as = "str" }

[[rule]]
id = "money.corpse"
kind = "money"
priority = 40
anchors = ["from the corpse"]
pattern = '''^You receive (?P<amount>.+?) from the corpse\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You receive 3 silver and 4 copper from the corpse."]
[rule.fields]
amount = { from = "amount", as = "str" }

[[rule]]
id = "money.purchase"
kind = "money"
priority = 50
anchors = ["You purchased "]
# why: distinct from money.vendor_sell above (that's selling to a
# vendor, this is buying from one). amount can be genuinely blank (a
# free/quest item, real: "You purchased 1 Package for Old Doug from
# Dougina for .") -- captured permissively, not required.
pattern = '''^You purchased (?P<qty>[0-9]+) (?P<item>.+?) from (?P<vendor>.+?) for\s*(?P<amount>[^.]*)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] You purchased 1 Backpack from Neuven for  7 gold 7 copper.",
  "[Tue Jul 28 15:02:15 2026] You purchased 1 Package for Old Doug from Dougina for .",
]
[rule.fields]
qty = { from = "qty", as = "u64" }
item = { from = "item", as = "str" }
vendor = { from = "vendor", as = "str" }
amount = { from = "amount", as = "str" }

[[rule]]
id = "trade.complete"
kind = "trade"
priority = 50
anchors = ["You complete the trade with"]
pattern = '''^You complete the trade with (?P<who>.+?)\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You complete the trade with Dead Doug."]
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "zone.enter"
kind = "zone"
priority = 40
anchors = ["You have entered"]
excludes = ["an area where"]
pattern = '''^You have entered (?P<zone>.+?)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] You have entered The Northern Desert of Ro.",
  "[Tue Jul 28 15:02:15 2026] You have entered New Sebilis Expedition.",
]
[rule.fields]
zone = { from = "zone", as = "str" }

[[rule]]
id = "state.location"
kind = "state"
priority = 40
anchors = ["Your Location is"]
# The "/loc" command's own output. Rare -- only appears when the player
# types it manually (confirmed: once in 2.8M lines of the reference log)
# -- so this is a "last known position" snapshot, not continuous
# tracking. Fields mix bare integers and decimals in real map data (see
# packs/eql.toml's mapsdata.rs sibling), so the coordinate group accepts
# both.
pattern = '''^Your Location is (?P<x>-?[0-9]+(?:\.[0-9]+)?), (?P<y>-?[0-9]+(?:\.[0-9]+)?), (?P<z>-?[0-9]+(?:\.[0-9]+)?)$'''
examples = ["[Tue Aug 18 22:28:36 2026] Your Location is 216.51, -103.09, -20.19"]
[rule.fields]
x = { from = "x", as = "f64" }
y = { from = "y", as = "f64" }
z = { from = "z", as = "f64" }

[[rule]]
id = "proc.item"
kind = "proc"
priority = 30
anchors = ["Your ", ") "]
pattern = '''^Your (?P<item>.+?) \((?P<effect>[^()]+)\) (?P<msg>.+)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Your Flowing Black Robe (Exaltation) flickers with a pale light.",
  "[Tue Jul 28 15:02:15 2026] Your Black Tome with Silver Runes (Exaltation) feels alive with power.",
]
[rule.fields]
item = { from = "item", as = "str" }
effect = { from = "effect", as = "str" }
message = { from = "msg", as = "str" }

