[[rule]]
id = "pet.summoned"
kind = "pet"
priority = 40
anchors = ["summon"]
# Never names the pet -- only the owner and the pet's flavour ("a frenzied
# spirit", "a lesser familiar", ...). The pet's own combat identity is a
# separate, unrelated name that shows up in the next few lines (its
# spawn self-buff routine). See docs/design/session.md-adjacent reasoning
# in eqlp-app's Ingest::note_actor for how that gets bridged.
pattern = '''^(?P<who>.+?) summons? (?:forth )?(?:a|an) (?P<flavor>[a-z][a-z ]*)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Rapha summons a frenzied spirit.",
  "[Tue Jul 28 15:02:15 2026] You summon forth a lesser familiar.",
  "[Tue Jul 28 15:02:15 2026] Forty summons forth a minor familiar.",
  "[Tue Jul 28 15:02:15 2026] Uktabi summons a companion spirit.",
  "[Tue Jul 28 15:02:15 2026] Mits summons a guardian spirit.",
]
[rule.fields]
who = { from = "who", as = "str" }
flavor = { from = "flavor", as = "str" }

[[rule]]
id = "ability.quickbuff"
kind = "ability"
priority = 40
anchors = ["Quick Buff"]
# Class-agnostic AA -- anyone can activate it -- that silently applies
# whatever buffs the activator already knows, with no "begins casting"
# line for any of them. Kept as its own rule rather than folded into
# ability.activated below: this is the one activation that opens a Quick
# Buff window (`Ingest::note_quickbuff`), a behavior no other ability
# activation has.
#
# `activates?` -- the log conjugates this by person: "You activate Quick
# Buff." for the log owner's own activation, "<Name> activates Quick
# Buff." third-person for anyone else. An earlier version only matched the
# third-person form, so the player's *own* Quick Buff bursts -- the
# highest-value evidence, since it's provably their own known spells --
# never opened a window at all. Caught by a real-data test, not
# inspection: confirmed against the reference log, which has both forms.

pattern = '''^(?P<who>.+?) activates? Quick Buff\.$'''
examples = [
  "[Wed Jul 29 16:03:53 2026] Dippinsauce activates Quick Buff.",
  "[Tue Jul 28 21:13:56 2026] You activate Quick Buff.",
]
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "ability.activated"
kind = "ability"
priority = 40
anchors = ["activates "]
excludes = ["Quick Buff"]
# General discipline/poison activation -- 1,846 real occurrences across 23
# distinct abilities, 100% third-person (the log owner never sees their
# *own* activation this way -- only other players'). classdata::
# classes_for recognizes 9 of the 23 (all Rogue poisons: Antimagic,
# Binding, Clumsiness, Concussive, Fettering, Mage Bane, Neurotoxic,
# Paralytic, Thought Drain); the rest just yield no evidence, same as any
# unrecognized spell name -- not a guess, a real lookup against the same
# data every other cast already uses.
#
# The real value here isn't the log owner's own state (they're never the
# `who`) -- it's identifying *other players'* classes from something they
# visibly did, and confirming what's now on their weapon (fed to
# `Effects` as a self-directed state fact on the activator, same
# mechanism as any other recognized state).
pattern = '''^(?P<who>.+?) activates? (?P<ability>.+?)\.$'''
examples = [
  "[Thu Aug 13 21:46:48 2026] Aella activates Asp Venom.",
  "[Thu Aug 13 21:46:57 2026] Aella activates Blood Siphon Venom.",
]
[rule.fields]
who = { from = "who", as = "str" }
ability = { from = "ability", as = "str" }
