  "[Wed Sep 02 00:49:13 2026] [50 SHD/BRD/SHM] Magitek (Wood Elf) <Severely Artistic> ZONE: The Plane of Hate 3244 (hateplane)  ",
  "[Tue Sep 08 12:00:00 2026] AFK [49 SHD/MNK/SHM] Fistopher (Iksar) <Dad Bods> ZONE: The Northern Desert of Ro (nro)",
]
[rule.fields]
level = { from = "level", as = "str" }
classes = { from = "classes", as = "str" }
name = { from = "name", as = "str" }
race = { from = "race", as = "str" }
# why: "Label (shortname)" -- the game's own map-file name for the zone,
# which the wiki's who_name disagrees with (Oasis of Marr is "marr"
# there, "oasis" in the game and in the map folder)
