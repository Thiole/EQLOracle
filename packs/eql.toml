  "[Tue Jul 28 15:02:15 2026] Kaeus sinks into the ground.",
  "[Tue Jul 28 15:02:15 2026] Knight V`Tal is engulfed by a swarm.",
  "[Tue Jul 28 15:02:15 2026] Splitpaw Sentry regains concentration and continues casting.",
  "[Tue Jul 28 15:02:15 2026] Wallhalla feels a healing touch.",
  "[Tue Jul 28 15:02:15 2026] Sabertooth Overseer is protected by a vortex of shadows.",
  "[Tue Jul 28 15:02:15 2026] Minsky creates a mystic portal.",
  "[Tue Jul 28 15:02:15 2026] Zibarer is entwined by roots.",
  "[Tue Jul 28 15:02:15 2026] Bravesirrobin is burning.",
  "[Tue Jul 28 15:02:15 2026] Warlord Skarlon is stung by a dozen flashes of the blade.",
  "[Tue Jul 28 15:02:15 2026] Innoruuk, the Prince of Hate is stung by a dozen flashes of the blade.",
]
[rule.fields]
who = { from = "who", as = "str" }
state = { from = "state", as = "str" }

[[rule]]
id = "mobstate.awakened"
kind = "mobstate"
priority = 20
anchors = [" has been awakened by "]
# why: a sleeping mob roused by a nearby fight/noise -- real, 838
# combined occurrences in the reference log. "A " prefix on generic
# trash ("A Teir`Dal rogue has been awakened by...") is just part of the
# mob's own display name here, not special syntax, so one pattern
# covers both the named and generic-trash cases.
pattern = '''^(?P<who>.+?) has been awakened by (?P<waker>.+?)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Bravesirrobin has been awakened by a gnoll.",
  "[Tue Jul 28 15:02:15 2026] Korven Nisere has been awakened by Kaeus.",
  "[Tue Jul 28 15:02:15 2026] A Teir`Dal rogue has been awakened by Bravesirrobin.",
]
[rule.fields]
who = { from = "who", as = "str" }
waker = { from = "waker", as = "str" }

[[rule]]
id = "target.info"
kind = "target"
priority = 40
anchors = ["Targeted ("]
pattern = '''^Targeted \((?P<ttype>[^()]+)\): (?P<name>.+)$'''
examples = ["[Tue Jul 28 15:02:15 2026] Targeted (Player): Moritati"]
[rule.fields]
name = { from = "name", as = "str" }

[[rule]]
id = "target.none"
kind = "target"
priority = 40
anchors = ["You no longer have a target"]
pattern = '''^You no longer have a target\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You no longer have a target."]

[[rule]]
id = "noise.cast_failure"
kind = "noise"
priority = 50
anchors = ["target"]
pattern = '''^(?:Your target is too far away, get closer!|You cannot see your target\.|You must first select a target for this spell!)$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Your target is too far away, get closer!",
  "[Tue Jul 28 15:02:15 2026] You cannot see your target.",
]

[[rule]]
id = "noise.insufficient_mana"
kind = "noise"
priority = 50
anchors = ["Insufficient Mana"]
pattern = '''^Insufficient Mana to cast this spell!$'''
examples = ["[Tue Jul 28 15:02:15 2026] Insufficient Mana to cast this spell!"]

# ============================================================ entity state
# Transitions the state machine reads. These are logged regardless of who
# caused them -- a mez landing names no caster -- which is what lets entity
# state be tracked for fights the player has no part in.
#
# Not observable, and deliberately absent: memory blur, pacify and lull produce
# no result line at all. Those end up as an inferred `Lost` transition rather
# than being modelled as if the log reported them.

[[rule]]
id = "state.mesmerized"
kind = "state"
priority = 50
anchors = ["has been mesmerized"]
pattern = '''^(?P<who>.+?) has been mesmerized\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] a wan ghoul knight has been mesmerized."]
note = "No caster named. Break is silent: inferred when the mob deals damage again."
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "state.charmed"
kind = "state"
priority = 50
anchors = ["has been charmed"]
pattern = '''^(?P<who>.+?) has been charmed\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] an abhorrent has been charmed."]
note = "No caster named -- 179 landings against 85 of my own casts, so these are everyone's."
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "state.charm_broken"
kind = "state"
priority = 50
anchors = ["spell has worn off of"]
pattern = '''^Your (?P<spell>.+?) spell has worn off of (?P<who>.+?)\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Your Allure spell has worn off of an abhorrent."]
note = "Self only. No equivalent exists for other players' charms."
[rule.fields]
who = { from = "who", as = "str" }
spell = { from = "spell", as = "str" }

[[rule]]
id = "state.you_mesmerized"
kind = "state"
priority = 50
anchors = ["no longer mesmerized"]
pattern = '''^You are no longer mesmerized\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You are no longer mesmerized."]

[[rule]]
id = "state.you_poisoned"
kind = "state"
priority = 50
anchors = ["You have been poisoned"]
pattern = '''^You have been poisoned\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You have been poisoned."]
note = "First person -- 'has been poisoned' (state.poisoned) is the third-person form, same split this pack already uses for death.you_died/death.other."

[[rule]]
id = "state.you_summoned"
kind = "state"
priority = 50
anchors = ["You have been summoned"]
pattern = '''^You have been summoned!$'''
examples = ["[Tue Jul 28 15:02:15 2026] You have been summoned!"]

[[rule]]
id = "state.poisoned"
kind = "state"
priority = 50
anchors = ["has been poisoned"]
pattern = '''^(?P<who>.+?) has been poisoned\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] a rattlesnake has been poisoned."]
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "state.you_diseased"
kind = "state"
priority = 50
anchors = ["You have been diseased"]
# Same split as state.you_poisoned/state.poisoned -- 363 real first-person
# occurrences.
pattern = '''^You have been diseased\.$'''
examples = ["[Fri Aug 07 19:38:37 2026] You have been diseased."]

[[rule]]
id = "state.diseased"
kind = "state"
priority = 50
anchors = ["has been diseased"]
pattern = '''^(?P<who>.+?) has been diseased\.$'''
examples = ["[Fri Aug 07 19:52:48 2026] Dojii has been diseased."]
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "state.spell_overwritten"
kind = "state"
priority = 50
anchors = ["has been overwritten"]
pattern = '''^Your (?P<spell>.+?) spell on (?P<who>.+?) has been overwritten\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Your Allure spell on an abhorrent has been overwritten."]
note = "Doesn't name what overwrote it -- that's presumably the immediately preceding cast line, not reconstructed here. Self-only phrasing seen so far."
[rule.fields]
spell = { from = "spell", as = "str" }
who = { from = "who", as = "str" }

[[rule]]
id = "state.stance"
kind = "state"
priority = 50
anchors = ["You assume"]
# Self only -- the log doesn't report anyone else's stance changes.
# Stance name captured generically, not a fixed list, so a real stance
# this pack hasn't explicitly seen yet still parses (see stancedata.rs
# for which names actually have class data behind them).
pattern = '''^You assume an? (?P<stance>.+?) stance\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] You assume an evasive stance.",
  "[Tue Jul 28 15:02:15 2026] You assume a channeler stance.",
  "[Tue Jul 28 15:02:15 2026] You assume a balanced stance.",
]
[rule.fields]
stance = { from = "stance", as = "str" }

[[rule]]
id = "state.invocation"
kind = "state"
priority = 50
anchors = ["reciting the"]
# Self only -- same stance the log takes on stances, no equivalent for
# anyone else's invocation changes. Name captured generically (see
# invocationdata.rs for the real spelling quirks the log itself uses).
pattern = '''^You begin reciting the (?P<invocation>.+?) invocation\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] You begin reciting the arcane mastery invocation.",
  "[Tue Jul 28 15:02:15 2026] You begin reciting the inviolable invocation.",
  "[Tue Jul 28 15:02:15 2026] You begin reciting the overchannel invocation.",
]
[rule.fields]
invocation = { from = "invocation", as = "str" }

[[rule]]
id = "invis.fading"
kind = "state"
priority = 40
# The real early-warning line invisibility gives before it actually
# breaks -- confirmed against the reference log (9 real occurrences), and
# distinct from "You appear." (the line for when it's already gone, not
# tracked as its own rule yet -- nothing in this app needs it today).
anchors = ["starting to appear"]
pattern = '''^You feel yourself starting to appear\.$'''
examples = ["[Fri Jul 31 00:20:03 2026] You feel yourself starting to appear."]

[[rule]]
id = "spell.resisted"
kind = "resist"
priority = 40
anchors = ["resisted your"]
pattern = '''^(?P<who>.+?) resisted your (?P<spell>.+?)!$'''
examples = ["[Tue Jul 28 15:02:15 2026] A willowisp resisted your Garrison's Mighty Mana Shock VIII!"]
note = "Carries the rank numeral, which landed damage lines drop. A second rank source."
[rule.fields]
who = { from = "who", as = "str" }
spell = { from = "spell", as = "str" }

[[rule]]
id = "spell.you_resisted"
kind = "resist"
priority = 40
anchors = ["You resist "]
# The mirror of spell.resisted -- an incoming spell landing on the
# player, resisted. Present tense ("resist" not "resisted"), unlike
# every other resist line here -- confirmed real, not a typo.
pattern = '''^You resist (?P<caster>.+?)'s (?P<spell>.+?)!$'''
examples = ["[Tue Jul 28 15:02:15 2026] You resist Unbound Flame's Instill!"]
[rule.fields]
caster = { from = "caster", as = "str" }
spell = { from = "spell", as = "str" }

[[rule]]
id = "spell.resisted_by"
kind = "resist"
priority = 40
anchors = ["resisted "]
excludes = ["resisted your"]
# Third-party form of spell.resisted -- neither side is the player, both
# named explicitly instead of "your". Excludes "resisted your" so that
# more specific rule keeps owning its own case.
pattern = '''^(?P<who>.+?) resisted (?P<caster>.+?)'s (?P<spell>.+?)!$'''
examples = ["[Thu Jul 30 18:51:45 2026] Gynok Moltor resisted Kobeker's Cease!"]
[rule.fields]
who = { from = "who", as = "str" }
caster = { from = "caster", as = "str" }
spell = { from = "spell", as = "str" }

[[rule]]
id = "cast.blocked"
kind = "cast"
priority = 40
anchors = ["did not take hold on"]
# Always "Your <spell>" -- only ever shown to the caster about their own
# spell, never a third-person form (confirmed: 0/482 real occurrences are
# anything but "Your"). The trailing "(Blocked by <blocker>.)" names a
# buff already active on the target (a stacking conflict, not a resist)
# -- optional, since a real minority of these have no parenthetical at
# all ("...did not take hold on Bravesirrobin." and nothing else).
pattern = '''^Your (?P<spell>.+?) spell did not take hold on (?P<target>.+?)\.(?: \(Blocked by (?P<blocker>.+?)\.\))?$'''
examples = [
  "[Fri Aug 14 21:11:25 2026] Your Berserker Strength spell did not take hold on Hakujin. (Blocked by Berserker Spirit.)",
  "[Sat Aug 15 09:49:02 2026] Your Shield of Lava spell did not take hold on Bravesirrobin.",
]
[rule.fields]
spell = { from = "spell", as = "str" }
target = { from = "target", as = "str" }
blocker = { from = "blocker", as = "str" }

[[rule]]
id = "cast.blocked_self"
kind = "cast"
priority = 40
anchors = ["did not take hold."]
# Sibling of cast.blocked -- same "(Blocked by X.)" clause, but self-cast
# (no "on <target>" at all, confirmed real: 333/1419 of these lines).
# Target is always You -- there's no third-person form of this either.
pattern = '''^Your (?P<spell>.+?) spell did not take hold\.(?: \(Blocked by (?P<blocker>.+?)\.\))?$'''
examples = ["[Tue Jul 28 15:02:15 2026] Your Mist spell did not take hold. (Blocked by Turtle Skin.)"]
[rule.fields]
spell = { from = "spell", as = "str" }
blocker = { from = "blocker", as = "str" }

[[rule]]
id = "spell.pet_wore_off"
kind = "spell"
priority = 40
anchors = ["Your pet's "]
# Sibling of state.charm_broken's "worn off of <target>" shape, but for
# any of a pet's own buffs -- confirmed real: every "Your <spell> spell
# has worn off." line in the reference log is this pet form (1601/1601),
# never a non-pet equivalent.
pattern = '''^Your pet's (?P<spell>.+?) spell has worn off\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Your pet's Clinging Darkness spell has worn off."]
[rule.fields]
spell = { from = "spell", as = "str" }

[[rule]]
id = "pet.summoned"
kind = "pet"
priority = 40
anchors = ["summon"]
# Never names the pet -- only the owner and the pet's flavour ("a frenzied
# spirit", "a lesser familiar", ...). The pet's own combat identity is a
# separate, unrelated name that shows up in the next few lines (its
# spawn self-buff routine). See docs/design/session.md-adjacent reasoning
# in eqlp-app's Ingest::note_actor for how that gets bridged.
pattern = '''^(?P<who>.+?) summons? (?:forth )?(?:a|an) (?P<flavor>[a-z][a-z ]*)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Rapha summons a frenzied spirit.",
  "[Tue Jul 28 15:02:15 2026] You summon forth a lesser familiar.",
  "[Tue Jul 28 15:02:15 2026] Forty summons forth a minor familiar.",
  "[Tue Jul 28 15:02:15 2026] Uktabi summons a companion spirit.",
  "[Tue Jul 28 15:02:15 2026] Mits summons a guardian spirit.",
]
[rule.fields]
who = { from = "who", as = "str" }
flavor = { from = "flavor", as = "str" }

[[rule]]
id = "ability.quickbuff"
kind = "ability"
priority = 40
anchors = ["Quick Buff"]
# Class-agnostic AA -- anyone can activate it -- that silently applies
# whatever buffs the activator already knows, with no "begins casting"
# line for any of them. Kept as its own rule rather than folded into
# ability.activated below: this is the one activation that opens a Quick
# Buff window (`Ingest::note_quickbuff`), a behavior no other ability
# activation has.
#
# `activates?` -- the log conjugates this by person: "You activate Quick
# Buff." for the log owner's own activation, "<Name> activates Quick
# Buff." third-person for anyone else. An earlier version only matched the
# third-person form, so the player's *own* Quick Buff bursts -- the
# highest-value evidence, since it's provably their own known spells --
# never opened a window at all. Caught by a real-data test, not
# inspection: confirmed against the reference log, which has both forms.

pattern = '''^(?P<who>.+?) activates? Quick Buff\.$'''
examples = [
  "[Wed Jul 29 16:03:53 2026] Dippinsauce activates Quick Buff.",
  "[Tue Jul 28 21:13:56 2026] You activate Quick Buff.",
]
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "ability.activated"
kind = "ability"
priority = 40
anchors = ["activates "]
excludes = ["Quick Buff"]
# General discipline/poison activation -- 1,846 real occurrences across 23
# distinct abilities, 100% third-person (the log owner never sees their
# *own* activation this way -- only other players'). classdata::
# classes_for recognizes 9 of the 23 (all Rogue poisons: Antimagic,
# Binding, Clumsiness, Concussive, Fettering, Mage Bane, Neurotoxic,
# Paralytic, Thought Drain); the rest just yield no evidence, same as any
# unrecognized spell name -- not a guess, a real lookup against the same
# data every other cast already uses.
#
# The real value here isn't the log owner's own state (they're never the
# `who`) -- it's identifying *other players'* classes from something they
# visibly did, and confirming what's now on their weapon (fed to
# `Effects` as a self-directed state fact on the activator, same
# mechanism as any other recognized state).
pattern = '''^(?P<who>.+?) activates? (?P<ability>.+?)\.$'''
examples = [
  "[Thu Aug 13 21:46:48 2026] Aella activates Asp Venom.",
  "[Thu Aug 13 21:46:57 2026] Aella activates Blood Siphon Venom.",
]
[rule.fields]
who = { from = "who", as = "str" }
ability = { from = "ability", as = "str" }
