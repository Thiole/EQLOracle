[[rule]]
id = "melee.hit"
kind = "damage"
priority = 30
# Anchor is " of damage." rather than "points of damage." because 30,164 lines
# in the reference log use the singular "1 point of damage" -- anchoring on
# the plural silently dropped every one of them.
anchors = [" of damage."]
pattern = '''^(?P<src>.+?) (?P<verb>slashes|slash|bashes|bash|kicks|kick|hits|hit|cleaves|cleave|punches|punch|crushes|crush|pierces|pierce|strikes|strike|bites|bite|frenzies|frenzy|backstabs|backstab|reaves|reave|smites|smite|shoots|shoot|slices|slice|claws|claw|smashes|smash|mauls|maul|gores|gore|stings|sting) (?:on )?(?P<dst>.+?) for (?P<amt>[0-9,]+) points? of damage\.(?: \((?P<flag>[^()]+)\))?$'''
# why: a berserker's frenzy is logged "frenzies on <target>" -- the
# "on " is not part of the name (it made an "on a greater sphinx" entity)
examples = [
  "[Tue Sep 01 22:47:17 2026] Melkor frenzies on a heartsbane drake for 49 points of damage. (Critical)",
  "[Tue Jul 28 15:02:15 2026] Bouncer Krik slashes Beba for 59 points of damage.",
  "[Tue Jul 28 15:02:15 2026] Morbes bashes Pandos Flintside for 1 point of damage.",
  "[Tue Jul 28 15:02:15 2026] Bzzazzt stings Dippinsauce for 330 points of damage.",
  "[Tue Jul 28 15:02:15 2026] Eckson slashes Splitpaw Sentry for 45 points of damage. (Critical)",
  "[Tue Jul 28 15:02:15 2026] Bravesirrobin slashes Footman of V`Zher for 36 points of damage.",
  "[Tue Jul 28 15:02:15 2026] Luld slashes a rock golem for 128 points of damage.",
  "[Tue Jul 28 15:02:15 2026] Kabann slashes Innoruuk, the Prince of Hate for 43 points of damage.",
]
counterexamples = [
  "[Tue Jul 28 15:02:15 2026] Vhenwheel hit an armadillo for 4 points of magic damage by Lifetap.",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }
# Critical / Riposte / Rampage / Strikethrough / Slay Undead / Finishing Blow /
# Crippling Blow / Double Bow Shot, and combinations of them. Left as a free
# string: enumerating the set here would be an assumption the log does not
# license, and a new one shipping in a patch must not drop the line.
flag = { from = "flag", as = "str" }
# Was captured by the pattern but never exposed here -- every landed
# melee swing silently fell back to a single generic "Melee" ability
# bucket (`Ingest::canonical_melee_ability`'s own default arm) instead of
# "Punch"/"Slash"/"Kick"/etc, real per-verb tracking never actually ran.
verb = { from = "verb", as = "str" }

[[rule]]
id = "melee.miss"
kind = "miss"
priority = 30
anchors = ["but miss"]
# Trailing "(Riposte)"/"(Rampage)"/"(Flurry)"/"(Wild Rampage)" -- a special
# attack type can trigger on a swing that still misses, same as a landed
# one. The bare `!$` anchor used to hard-require nothing follow it at all,
# so all 5,022 real flagged misses fell straight through to unmatched
# entirely, not even counted as a plain miss -- see `melee.hit`'s own
# `flag` field for the precedent this mirrors.
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?:on )?(?P<dst>.+?), but miss(?:es)?!(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Abes tries to slash Bouncer Krik, but misses!",
  "[Tue Sep 01 22:47:17 2026] Melkor tries to frenzy on a heartsbane drake, but misses!",
  "[Tue Jul 28 15:02:15 2026] Bravesirrobin tries to slash Footman of V`Zher, but misses!",
  "[Fri Aug 07 00:00:07 2026] Socho Darkpaw tries to hit Bravesirrobin, but misses! (Riposte)",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
verb = { from = "verb", as = "str" }
flag = { from = "flag", as = "str" }

[[rule]]
id = "melee.blocked"
kind = "block"
priority = 30
# why: "blocks!" alone missed every real 2nd-person "YOU block!" line (no
# "s") -- the pattern already handled both conjugations, the anchor just
# never covered the one without it. Tens of thousands of real occurrences
# confirmed previously unmatched.
anchors = [" block"]
# Same swing-attempt shape as melee.miss, but the target actively avoided
# it -- kept as its own kind so a per-source accuracy breakdown can say
# "blocked" rather than lumping it in with a plain miss. `blocker` is
# expected to equal `dst` (the target blocking its own attacker); captured
# as a separate group rather than a backreference since this engine's
# regex has none. Trailing flag same as melee.miss's own note.
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?:on )?(?P<dst>.+?), but (?P<blocker>.+?) block(?:s)?!(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Wed Jul 29 16:31:31 2026] Sabertooth Overseer tries to frenzy on Kaeus, but Kaeus blocks!",
  "[Tue Jul 28 15:02:15 2026] Refuse tries to punch Refugee Splitpaw, but Refugee Splitpaw blocks!",
  "[Tue Jul 28 15:02:15 2026] Refuse tries to kick Refugee Splitpaw, but Refugee Splitpaw blocks!",
  "[Tue Jul 28 15:02:15 2026] A seafury cyclops tries to hit YOU, but YOU block!",
  "[Tue Jul 28 15:02:15 2026] Bzzazzt tries to sting YOU, but YOU block!",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
verb = { from = "verb", as = "str" }
flag = { from = "flag", as = "str" }

[[rule]]
id = "melee.dodged"
kind = "block"
priority = 30
anchors = ["dodge"]
# Same shape as melee.blocked, different avoidance type. "dodges" (3rd
# person) and "dodge" (the "YOU dodge!"/self form) both appear for real --
# same tr(?:ies|y) split covers the attacker's own conjugation already.
# Trailing flag same as melee.miss's own note.
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?:on )?(?P<dst>.+?), but (?P<dodger>.+?) dodges?!(?: \((?P<flag>[^()]+)\))?$'''
