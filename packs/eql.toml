[[rule]]
id = "aa.gained"
kind = "aa"
priority = 40
# Rank 1 of an AA, first purchase ever -- distinct from "aa.improved"
# below (rank 2+), which uses "improved <name> <rank>" instead of a
# quoted name and has no rank-1 case of its own. Cost is "N ability
# points." even at cost 0 or 1 -- always plural here, unlike
# aa.improved's own "1 ability point." singular at exactly cost 1 --
# confirmed against the real reference log, not assumed grammar.
anchors = [" at a cost of "]
pattern = '''^You have gained the ability "(?P<name>.+?)" at a cost of (?P<cost>[0-9]+) ability points?\.$'''
examples = [
  "[Fri Aug 07 00:25:51 2026] You have gained the ability \"Unbound Drain\" at a cost of 0 ability points.",
  "[Fri Aug 07 21:00:06 2026] You have gained the ability \"Innate Regeneration\" at a cost of 1 ability points.",
  "[Fri Jul 31 16:55:33 2026] You have gained the ability \"Spell Casting Deftness\" at a cost of 2 ability points.",
]
counterexamples = [
  # Innate skill grants (Bash, Riposte, Dodge, ...) -- no quotes, no
  # cost clause, not a real AA purchase. Never matches this pattern
  # since there's nothing to fill `name`/`cost` from.
  "[Sat Aug 08 00:36:12 2026] You have gained the ability to use Double Attack.",
]
[rule.fields]
name = { from = "name", as = "str" }
cost = { from = "cost", as = "u64" }

[[rule]]
id = "aa.improved"
kind = "aa"
priority = 40
# Rank 2+ of an AA already owned -- "improved <name> <rank>", not
# "gained the ability". No AA name in the catalog ends in a digit (see
# aadata.rs's module doc), so the non-greedy `name` capture followed by
# a bare rank number never mis-splits.
anchors = [" at a cost of "]
pattern = '''^You have improved (?P<name>.+?) (?P<rank>[0-9]+) at a cost of (?P<cost>[0-9]+) ability points?\.$'''
examples = [
  "[Fri Aug 07 21:00:06 2026] You have improved Innate Regeneration 2 at a cost of 1 ability point.",
  "[Mon Aug 03 18:13:44 2026] You have improved Adamant Will 2 at a cost of 4 ability points.",
  "[Mon Aug 03 18:13:44 2026] You have improved Harm Touch 8 at a cost of 0 ability points.",
]
[rule.fields]
name = { from = "name", as = "str" }
rank = { from = "rank", as = "u64" }
cost = { from = "cost", as = "u64" }

[[rule]]
id = "ability.point_gained_first"
kind = "ability"
priority = 40
anchors = ["gained an ability point"]
# why: the singular first-point phrasing ("an ability point" / "N
# ability points", no parens) -- a genuinely different trailing shape
# from ability.point_gained below (which always uses "point(s)" on both
# sides), not just a number substitution.
# why: the tail is "1 ability point." at exactly one -- 12 of 225 in a
# real log, every first point after spending to zero, all unmatched.
pattern = '''^You have gained an ability point!\s+You now have (?P<total>[0-9]+) ability points?\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] You have gained an ability point!  You now have 5 ability points.",
  "[Sun Sep 06 21:14:11 2026] You have gained an ability point!  You now have 9 ability points.",
  "[Sun Sep 06 21:14:11 2026] You have gained an ability point!  You now have 1 ability point.",
]
[rule.fields]
total = { from = "total", as = "u64" }

[[rule]]
id = "ability.point_gained"
kind = "ability"
priority = 40
anchors = ["ability point(s)!"]
pattern = '''^You have gained (?P<qty>[0-9]+) ability point\(s\)!\s+You now have (?P<total>[0-9]+) ability point\(s\)\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] You have gained 2 ability point(s)!  You now have 10 ability point(s)."]
[rule.fields]
qty = { from = "qty", as = "u64" }
total = { from = "total", as = "u64" }

[[rule]]
id = "faction.adjust"
kind = "faction"
priority = 40
anchors = ["faction standing with"]
pattern = '''^Your faction standing with (?P<faction>.+?) has been adjusted by (?P<delta>-?[0-9]+)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Your faction standing with Neriak Ogre has been adjusted by 5.",
  "[Tue Jul 28 15:02:15 2026] Your faction standing with Keepers of the Art has been adjusted by -20.",
]
[rule.fields]
faction = { from = "faction", as = "str" }
delta = { from = "delta", as = "i64" }

