  "[Tue Jul 28 15:02:15 2026] A leering gargoyle tries to hit Bravesirrobin, but Bravesirrobin dodges!",
]
[rule.fields]
source = { from = "src", as = "str" }
target = { from = "dst", as = "str" }
verb = { from = "verb", as = "str" }
flag = { from = "flag", as = "str" }

[[rule]]
id = "melee.parried"
kind = "block"
priority = 30
anchors = ["parr"]
# Same shape as melee.blocked/melee.dodged, the 4th real avoidance type.
# Trailing flag same as melee.miss's own note. `parries|parry` -- the
# 2nd-person form is "YOU parry!" not "YOU parries!" (157 real
# occurrences of the YOU form missed entirely before this), same
# distinction melee.dodged's own `dodges?` already made; anchor
# loosened from the literal "parries!" to "parr" since "parry!" alone
# doesn't contain that substring.
pattern = '''^(?P<src>.+?) tr(?:ies|y) to (?P<verb>[a-z]+) (?:on )?(?P<dst>.+?), but (?P<parrier>.+?) (?:parries|parry)!(?: \((?P<flag>[^()]+)\))?$'''
