# ============================================================ second pass
# Everything below was added by running `coverage` against the reference log and
# working down the unmatched-shape list. This is the intended loop.

[[rule]]
id = "dot.damage_uncredited"
kind = "damage"
priority = 40
anchors = ["has taken "]
excludes = [" damage from "]
pattern = '''^(?P<dst>.+?) has taken (?P<amt>[0-9,]+) damage by (?P<spell>.+?)\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Zaser has taken 1 damage by Disease Cloud."]
note = "No caster named. 1,952 occurrences against 36,065 of the credited form."
[rule.fields]
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }
spell = { from = "spell", as = "str" }

[[rule]]
id = "dot.damage_from_you"
kind = "damage"
priority = 40
anchors = ["damage from your "]
# A third shape alongside dot.damage/dot.damage_uncredited above: the
# caster is named via the possessive "your" instead of a trailing "by
# <caster>" clause, so `dot.damage`'s own pattern (which requires that
# clause) never matches these -- they fell straight through both existing
# rules. 8,621 real occurrences across 12 distinct real DoTs (Elemental
# Maelstrom, Suffocating Sphere, Leech, Harm Touch, Clinging Darkness,
# Choke, Gasping Embrace, Stinging Swarm, Suffocate), all silently missing
# from the player's own DPS until now.
pattern = '''^(?P<dst>.+?) ha[sv]e? taken (?P<amt>[0-9,]+) damage from your (?P<spell>.+?)\.(?: \((?P<flag>[^()]+)\))?$'''
examples = [
  "[Fri Aug 07 00:00:07 2026] Orc scoutsman has taken 104 damage from your Elemental Maelstrom X.",
  "[Sun Aug 09 04:21:39 2026] Orc legionnaire has taken 16 damage from your Leech. (Critical)",
]
[rule.fields]
target = { from = "dst", as = "str" }
amount = { from = "amt", as = "u64" }
spell = { from = "spell", as = "str" }
flag = { from = "flag", as = "str" }

[[rule]]
id = "cast.interrupted"
kind = "cast"
priority = 40
anchors = ["spell is interrupted"]
pattern = '''^(?:Your|(?P<who>.+?)'s) (?P<spell>.+?) spell is interrupted\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Your Burst of Flame spell is interrupted.",
  "[Tue Jul 28 15:02:15 2026] Cylic's Burst of Flame spell is interrupted.",
  "[Tue Jul 28 15:02:15 2026] a frightfinger's Elnerick's Entombment of Ice spell is interrupted.",
]
note = '''
Fields were never wired up before eqlp_session::cast::Resolver needed them --
see BACKLOG.md's cast-outcome work. Splitting on a bare space (the original
form) put src="a" and spell="frightfinger's Elnerick's Entombment of Ice" for
every article-prefixed caster ("a boogeyman", "a frightfinger", ...) --
confirmed wrong on 261 of 9,022 real occurrences. Splitting on the literal 's
instead of any space fixes it: the caster's own possessive is always the
first one in the line, even when the spell name carries its own ("Kragg's
Salve"). `who` doesn't participate on the `Your` branch -- see
`Ingest::extract_action`, which defaults it to "You".
'''
[rule.fields]
source = { from = "who", as = "str" }
spell = { from = "spell", as = "str" }

[[rule]]
id = "cast.fizzled"
kind = "cast"
priority = 40
anchors = ["spell fizzles!"]
pattern = '''^(?:Your|(?P<src>.+?)'s) (?P<spell>.+?) spell fizzles!$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Your Burst of Flame spell fizzles!",
  "[Tue Jul 28 15:02:15 2026] Aahz's Kragg's Salve spell fizzles!",
]
note = "974 occurrences, previously unmatched. Splits on the literal 's rather than the first space -- see cast.interrupted's note for why: a bare-space split silently truncates article-prefixed casters ('a boogeyman') to just their article. No article-prefixed caster happens to fizzle in the reference log (0/974), but nothing here should rely on that being true of every log."
[rule.fields]
source = { from = "src", as = "str" }
spell = { from = "spell", as = "str" }

[[rule]]
id = "spell.warded"
kind = "spell"
priority = 40
anchors = ["but you are protected"]
pattern = '''^(?P<src>.+?) tries to cast a spell on you, but you are protected\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Dippinsauce tries to cast a spell on you, but you are protected."]

[[rule]]
id = "faction.maxed"
kind = "faction"
priority = 50
anchors = ["could not possibly get any"]
pattern = '''^Your faction standing with (?P<faction>.+?) could not possibly get any (?P<dir>better|worse)\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Your faction standing with Dark Bargainers could not possibly get any better."]
[rule.fields]
