[[rule]]
id = "expedition.cooldown"
kind = "noise"
priority = 40
anchors = ["cannot be added to this expedition"]
# why: the single biggest still-unmatched shape at the time this was
# added (592 real occurrences) -- verbose client text, captured for
# real (who/event/instance name) even though nothing downstream reads
# it yet, same stance pet.summoned's own doc takes on this.
pattern = '''^(?P<who>.+?) cannot be added to this expedition since they have recently experienced (?P<event>.+?)\.\s+They must wait another [0-9dhms:]+ until they can experience it again\.\s+They may be added to the expedition later, once (?P<event2>.+?) has been completed\.$'''
examples = ["[Tue Jul 28 15:02:15 2026] Dima cannot be added to this expedition since they have recently experienced Unknown Event.  They must wait another 0d:0h:0m:0s until they can experience it again.  They may be added to the expedition later, once Unknown Event has been completed."]
[rule.fields]
who = { from = "who", as = "str" }
event = { from = "event", as = "str" }

[[rule]]
id = "pet.summoned"
kind = "pet"
priority = 40
anchors = ["summon"]
# Never names the pet -- only the owner and the pet's flavour ("a frenzied
# spirit", "a lesser familiar", ...). The pet's own combat identity is a
# separate, unrelated name that shows up in the next few lines (its
# spawn self-buff routine). See docs/design/session.md-adjacent reasoning
# in eqlp-app's Ingest::note_actor for how that gets bridged.
pattern = '''^(?P<who>.+?) summons? (?:forth )?(?:a|an) (?P<flavor>[a-z][a-z ]*)\.$'''
examples = [
  "[Tue Jul 28 15:02:15 2026] Rapha summons a frenzied spirit.",
  "[Tue Jul 28 15:02:15 2026] You summon forth a lesser familiar.",
  "[Tue Jul 28 15:02:15 2026] Forty summons forth a minor familiar.",
  "[Tue Jul 28 15:02:15 2026] Uktabi summons a companion spirit.",
  "[Tue Jul 28 15:02:15 2026] Mits summons a guardian spirit.",
]
[rule.fields]
who = { from = "who", as = "str" }
flavor = { from = "flavor", as = "str" }


[[rule]]
id = "pet.warder_attuned"
kind = "pet"
priority = 40
anchors = ["attunes with their warder"]
# why: a Beastlord's warder arriving; the warder itself logs as "<who>`s
# warder", so ownership needs no bridging -- this is class evidence
pattern = '''^(?P<who>.+?) attunes with their warder\.$'''
examples = ["[Tue Sep 08 12:00:00 2026] Skywarp attunes with their warder."]
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "ability.quickbuff"
kind = "ability"
priority = 40
anchors = ["Quick Buff"]
# Class-agnostic AA -- anyone can activate it -- that silently applies
# whatever buffs the activator already knows, with no "begins casting"
# line for any of them. Kept as its own rule rather than folded into
# ability.activated below: this is the one activation that opens a Quick
# Buff window (`Ingest::note_quickbuff`), a behavior no other ability
# activation has.
#
# `activates?` -- the log conjugates this by person: "You activate Quick
# Buff." for the log owner's own activation, "<Name> activates Quick
# Buff." third-person for anyone else. An earlier version only matched the
# third-person form, so the player's *own* Quick Buff bursts -- the
# highest-value evidence, since it's provably their own known spells --
# never opened a window at all. Caught by a real-data test, not
# inspection: confirmed against the reference log, which has both forms.

pattern = '''^(?P<who>.+?) activates? Quick Buff\.$'''
examples = [
  "[Wed Jul 29 16:03:53 2026] Dippinsauce activates Quick Buff.",
  "[Tue Jul 28 21:13:56 2026] You activate Quick Buff.",
]
[rule.fields]
who = { from = "who", as = "str" }

[[rule]]
id = "ability.activated"
kind = "ability"
priority = 40
# why: "activates " (with the trailing "s") missed every real 1st-person
# "You activate X." line -- same anchor-too-narrow bug melee.blocked's
# own doc found. The doc below used to claim this was 100% third-person;
# real data (327 "You activate ..." lines, confirmed) disproves that --
# corrected, and the log owner's own poison casts now feed classdetect
# too, not just other players'.
anchors = ["activate"]
excludes = ["Quick Buff"]
# General discipline/poison activation -- 1,846 real occurrences across 23
# distinct abilities. classdata::classes_for recognizes 9 of the 23 (all
# Rogue poisons: Antimagic, Binding, Clumsiness, Concussive, Fettering,
# Mage Bane, Neurotoxic, Paralytic, Thought Drain); the rest just yield no
# evidence, same as any unrecognized spell name -- not a guess, a real
# lookup against the same data every other cast already uses. "Asp
# Venom"/"Blood Siphon Venom" (this rule's own examples) are 2 of the
# unrecognized 14 -- real poisons, just not in spell_classes.json's own
# scrape yet.
#
# Also confirms what's now on the activator's weapon (fed to `Effects` as
# a self-directed state fact on the activator, same mechanism as any
# other recognized state) -- real value for *other* players even where
# the specific poison isn't classdata-recognized.
pattern = '''^(?P<who>.+?) activates? (?P<ability>.+?)\.$'''
examples = [
  "[Thu Aug 13 21:46:48 2026] Aella activates Asp Venom.",
  "[Thu Aug 13 21:46:57 2026] Aella activates Blood Siphon Venom.",
  "[Thu Aug 13 21:46:57 2026] You activate Blood Siphon Venom.",
]
[rule.fields]
who = { from = "who", as = "str" }
ability = { from = "ability", as = "str" }
