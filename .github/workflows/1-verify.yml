# Gate 1 — every push and PR. Must be fast enough that nobody routes around it.
# Nothing here needs a display, a browser, or a game client.
name: verify

on:
  push:
    branches: [main, testing, beta, "feature/**"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Install Linux dependencies
        # why: `cargo clippy`/`cargo test --workspace` below both compile
        # the `app` crate (a real workspace member, not opt-in), which
        # pulls in Tauri's own glib-sys/gtk-sys etc. -- those need the
        # real GTK3 dev headers on the build machine, same list
        # 3-release.yml's Linux job already carries for its own build.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - name: Build frontend
        # why: tauri::generate_context!() (crates/app/src/main.rs) reads
        # frontendDist ("../../ui/dist") off disk at *macro-expansion*
        # time -- it must already exist before `cargo` touches the `app`
        # crate at all, for any plain cargo command (build/test/clippy).
        # cargo tauri build gets this for free via its own
        # beforeBuildCommand hook (see tauri.conf.json), but that hook is
        # tauri-cli-specific and never fires for a bare `cargo` invocation
        # like every step below -- confirmed the hard way, this job's own
        # first real run after 3-release.yml/2-beta.yml already worked.
        working-directory: ui
        run: |
          npm ci
          npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

      - name: no ambient time outside the clock module
        run: |
          hits=$(grep -rn --include='*.rs' -e 'Instant::now' -e 'SystemTime::now' \
                   crates/ src-tauri/ 2>/dev/null \
                 | grep -v 'crates/source/src/clock.rs' \
                 | grep -v 'clock-exempt' \
                 | grep -vE ':[[:space:]]*(//|//!|///)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::use Clock, not ambient time. Append '// clock-exempt: <why>' if wall time is genuinely correct."
            exit 1
          fi

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # Short smoke run per target. The long campaign is the nightly job --
      # a PR gate that takes 20 minutes is a gate people learn to ignore.
      - name: fuzz smoke
        run: |
          for t in $(cargo fuzz list); do
            echo "::group::$t"
            cargo fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: fuzz-crashes, path: fuzz/artifacts/ }

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p eqlp-cli
      - run: ./target/release/eqlp lint --pack packs/eql.toml
      - name: coverage must not regress
        run: |
          ./target/release/eqlp lint --pack packs/eql.toml \
            --against fixtures/reference-slice.log --min-rate 0.80
