# Blind-Windows overlay harness. Multiple Windows users report no overlay
# renders at all; no Windows machine exists locally. This builds the real
# app on a Windows runner, opens a real overlay through the normal
# create path (--overlay-probe), writes the OS's own readback to
# overlay-probe.json, and screenshots the desktop while the overlay is
# up. The screenshot answers the one question source-reading cannot:
# does WebView2 actually paint inside this window.
name: overlay probe

on:
  push:
    branches: ["probe/**"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
        working-directory: ui
      # debug build on purpose: console subsystem stays attached and the
      # build is far faster; the window/overlay path is identical
      - run: npm run tauri build -- --debug
        working-directory: ui
      - name: run probe and screenshot
        shell: pwsh
        run: |
          $exe = "target\debug\eqlp-app.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem -Recurse target -Filter *.exe | Select-Object FullName; throw "app exe not found" }
          $p = Start-Process -FilePath $exe -ArgumentList '--overlay-probe' -PassThru `
                 -RedirectStandardOutput probe-stdout.txt -RedirectStandardError probe-stderr.txt
          # probe timeline: ~5s boot wait, overlay opens, +5s, json written, then holds
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("probe-screenshot.png")
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (Test-Path overlay-probe.json) { Get-Content overlay-probe.json } else { Write-Host "overlay-probe.json missing" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-probe
          path: |
            overlay-probe.json
            probe-screenshot.png
            probe-stdout.txt
            probe-stderr.txt
          if-no-files-found: warn
