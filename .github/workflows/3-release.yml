name: release

on:
  push:
    branches: [main, testing]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

# why: two rolling channels, not tag-triggered -- routine work pushes to
# `testing` (auto-published under the "testing" tag, prerelease), a real
# release is a deliberate, separate push to `main` (published under
# "latest", the channel GitHub's own "Latest release" badge follows).
# Neither is semver-tagged -- nothing in the repo does that yet; each
# channel's tag just moves to whatever that branch last built successfully.

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: ui/package-lock.json }

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build Linux application
        run: cargo tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eqlp-linux
          path: |
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: ui/package-lock.json }

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build Windows application
        run: cargo tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eqlp-windows
          path: |
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi

  publish:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: eqlp-*
          merge-multiple: true

      # why: branch decides the channel -- main is the only deliberate,
      # explicit release trigger (a separate push someone chose to make),
      # everything else lands on testing
      - name: Determine channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Latest release" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=testing" >> "$GITHUB_OUTPUT"
            echo "name=Testing build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish/replace the rolling channel release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.channel.outputs.tag }}
          name: ${{ steps.channel.outputs.name }}
          # why: a rolling tag needs its own commit's notes, not
          # whatever an old release's body said -- overwritten every run
          body: |
            Automated build from ${{ github.ref_name }} @ ${{ github.sha }}.
            Not a semver release -- this tag moves to whatever ${{ github.ref_name }} last built successfully.
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          make_latest: ${{ github.ref_name == 'main' }}
          target_commitish: ${{ github.sha }}
          files: dist/**
