name: release

on:
  push:
    branches: [main, testing]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

# why: two rolling channels, not tag-triggered -- routine work pushes to
# `testing` (auto-published under the "testing" tag, prerelease), a real
# release is a deliberate, separate push to `main` (published under
# "latest", the channel GitHub's own "Latest release" badge follows).
# Neither is semver-tagged -- nothing in the repo does that yet; each
# channel's tag just moves to whatever that branch last built successfully.
#
# Uses tauri-apps/tauri-action, not a hand-rolled build+sign+upload --
# `cargo tauri build` alone signs each bundle (confirmed real: produces
# a real .sig next to it) but never assembles the updater's own
# `latest.json` manifest; that assembly, plus correctly merging it
# across this workflow's own Linux+Windows matrix onto one shared
# release, is exactly what this action is for. Needs both signing
# secrets (TAURI_SIGNING_PRIVATE_KEY/_PASSWORD) already stored on the repo.

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: ui/package-lock.json }

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      # why: branch decides the channel -- main is the only deliberate,
      # explicit release trigger (a separate push someone chose to make),
      # everything else lands on testing
      - name: Determine channel
        id: channel
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Latest release" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=testing" >> "$GITHUB_OUTPUT"
            echo "name=Testing build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/app
          tagName: ${{ steps.channel.outputs.tag }}
          releaseName: ${{ steps.channel.outputs.name }}
          releaseBody: |
            Automated build from ${{ github.ref_name }} @ ${{ github.sha }}.
            Not a semver release -- this tag moves to whatever ${{ github.ref_name }} last built successfully.
          releaseDraft: false
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          includeUpdaterJson: true
