name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# why: a rolling "latest" release, not tag-triggered -- this workflow
# already runs on every main push (see `on:` above), and nothing in the
# repo does semver tagging yet. Re-publishing the same "latest" tag on
# every green main build is what actually makes the builds land
# somewhere a person can download them, without inventing a versioning
# scheme nobody asked for.

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: ui/package-lock.json }

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build Linux application
        run: cargo tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eqlp-linux
          path: |
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: ui/package-lock.json }

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build Windows application
        run: cargo tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eqlp-windows
          path: |
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi

  publish:
    name: Publish latest release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: eqlp-*
          merge-multiple: true

      - name: Publish/replace the rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          # why: a rolling tag needs its own commit's notes, not
          # whatever an old release's body said -- overwritten every run
          body: |
            Automated build from main @ ${{ github.sha }}.
            Not a stable/tagged release -- this tag moves to whatever main last built successfully.
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: dist/**
