name: release

on:
  push:
    branches: [main, testing]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

# why: two pushes in quick succession used to race two whole release
# runs against one shared rolling release -- with finalize pruning to
# "0.1.0 + this run's build", an older run's finalize landing AFTER a
# newer run's uploads would delete the newer build's own assets out
# from under its manifest. Only the newest push's run may live.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# why: two rolling channels, not tag-triggered -- routine work pushes to
# `testing` (auto-published under the "testing" tag, prerelease), a real
# release is a deliberate, separate push to `main` (published under
# "latest", the channel GitHub's own "Latest release" badge follows).
# Neither is semver-tagged -- nothing in the repo does that yet; each
# channel's tag just moves to whatever that branch last built successfully.
#
# Uses tauri-apps/tauri-action, not a hand-rolled build+sign+upload --
# `cargo tauri build` alone signs each bundle (confirmed real: produces
# a real .sig next to it) but never assembles the updater's own
# `latest.json` manifest; that assembly, plus correctly merging it
# across this workflow's own Linux+Windows matrix onto one shared
# release, is exactly what this action is for. Needs both signing
# secrets (TAURI_SIGNING_PRIVATE_KEY/_PASSWORD) already stored on the repo.

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: ui/package-lock.json }

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      # why: branch decides the channel -- main is the only deliberate,
      # explicit release trigger (a separate push someone chose to make),
      # everything else lands on testing
      - name: Determine channel
        id: channel
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Latest release" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=testing" >> "$GITHUB_OUTPUT"
            echo "name=Testing build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          # why: real bug, caught live -- tauri.conf.json's own
          # plugins.updater.endpoints is a single hardcoded URL (the
          # `latest` tag), so every build, testing included, shipped
          # with an updater that only ever checked the main channel's
          # manifest. A testing build's own "check for updates" could
          # never see a fresh testing push -- it was always comparing
          # against whatever `latest` last published, which is only
          # ever main. Each channel now gets its own endpoint, merged
          # over the base config at build time (see the tauri-action
          # step's own --config override below), matching the tag this
          # exact build is about to be published under.
          echo "endpoint=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name == 'main' && 'latest' || 'testing' }}/latest.json" >> "$GITHUB_OUTPUT"
          # why: real bug, caught live, the actual one blocking Spencer's
          # own "check for updates" click -- tauri_plugin_updater's
          # default comparator (this app registers no custom one, see
          # updater.rs) is a strict `release.version > current_version`,
          # nothing else, no pub_date fallback. tauri.conf.json's own
          # version never gets bumped by hand for a rolling testing
          # build, so every testing publish still says "0.1.0", forever
          # equal to whatever's already installed -- the endpoint fix
          # above was necessary but not sufficient, this is the other
          # half. Only the testing channel gets a synthetic version here
          # -- main's version is a deliberate human decision each real
          # release, left alone. run_number always increases across this
          # workflow file's own runs, so each testing build reliably
          # outranks the one before it; a patch bump on the base's own
          # major.minor (read live from tauri.conf.json, not hardcoded --
          # a hardcoded "0.1" went stale the moment main bumped to 0.2.0,
          # which would have ranked every new beta BELOW the public
          # release), not a prerelease suffix on the same base -- semver
          # ranks ANY prerelease of X.Y.0 BELOW plain X.Y.0 itself, which
          # would have made this fix actively worse than doing nothing.
          # Convention this leans on: main releases bump minor and keep
          # patch 0, so <maj>.<min>.<run> always outranks the public
          # <maj>.<min>.0 it's built past.
          if [ "${{ github.ref_name }}" != "main" ]; then
            # why: sed, not jq -- one less tool the runner must have
            base=$(sed -n 's/.*"version": *"\([0-9.]*\)".*/\1/p' crates/app/tauri.conf.json | head -1)
            echo "version=${base%.*}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      # why: a file, not an inline --config JSON string -- avoids relying
      # on how tauri-action's own `args` gets shell-split across two
      # different runner OSes for a value full of quotes/braces/colons.
      # tauri v2's own --config accepts a path, deep-merged over
      # tauri.conf.json -- only overrides the endpoints array (and, on
      # the testing channel only, version -- see the step above), the
      # pubkey and everything else still comes from the base config.
      - name: Write channel-specific updater config
        shell: bash
        run: |
          version_field=""
          if [ -n "${{ steps.channel.outputs.version }}" ]; then
            version_field="\"version\":\"${{ steps.channel.outputs.version }}\","
          fi
          printf '{%s"plugins":{"updater":{"endpoints":["%s"]}}}' \
            "$version_field" "${{ steps.channel.outputs.endpoint }}" \
            > "${{ github.workspace }}/updater-channel.conf.json"
          cat "${{ github.workspace }}/updater-channel.conf.json"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/app
          args: --config ${{ github.workspace }}/updater-channel.conf.json
          tagName: ${{ steps.channel.outputs.tag }}
          releaseName: ${{ steps.channel.outputs.name }}
          releaseBody: |
            Automated build from ${{ github.ref_name }} @ ${{ github.sha }}.
            Not a semver release -- this tag moves to whatever ${{ github.ref_name }} last built successfully.
          releaseDraft: false
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          # why: real incident -- tauri-action's own manifest let the rpm's
          # updater entry overwrite the AppImage's under the same
          # linux-x86_64 key, and the shipped updater then wrote an RPM
          # over a user's running AppImage file (destroyed a real
          # install). Its replace-before-upload also stopped finding the
          # old latest.json once the rolling release passed ~100
          # accumulated assets (paginated lookup), 422ing the whole leg.
          # The finalize job below assembles the manifest instead.
          includeUpdaterJson: false

  # why: runs once, after BOTH platform legs succeed -- assembles a
  # correct latest.json from the assets actually uploaded (AppImage for
  # linux, never the rpm; setup.exe for windows), force-replaces the old
  # manifest, and prunes the rolling release down to 0.1.0 plus the
  # build this run just published (player's own spec: "only should be
  # 0.1.0 and most current version"). On any leg failure this never
  # runs, so the manifest always describes a complete, real build.
  finalize:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble manifest and prune release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAG=latest
            VERSION=$(python3 -c "import json;print(json.load(open('crates/app/tauri.conf.json'))['version'])")
          else
            TAG=testing
            VERSION="0.1.${{ github.run_number }}"
          fi
          REPO="${{ github.repository }}"
          APPIMAGE="EQL.Oracle_${VERSION}_amd64.AppImage"
          SETUP="EQL.Oracle_${VERSION}_x64-setup.exe"

          # why: the .sig files ARE the manifest signatures -- download just those two
          gh release download "$TAG" --repo "$REPO" -D sigs \
            --pattern "${APPIMAGE}.sig" --pattern "${SETUP}.sig"

          python3 - "$TAG" "$VERSION" "$REPO" "$APPIMAGE" "$SETUP" <<'PY'
          import json, sys, datetime
          tag, version, repo, appimage, setup = sys.argv[1:6]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          manifest = {
              "version": version,
              "notes": f"Automated build from {tag} channel.",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": {
                  "linux-x86_64": {
                      "signature": open(f"sigs/{appimage}.sig").read().strip(),
                      "url": f"{base}/{appimage}",
                  },
                  "windows-x86_64": {
                      "signature": open(f"sigs/{setup}.sig").read().strip(),
                      "url": f"{base}/{setup}",
                  },
              },
          }
          json.dump(manifest, open("latest.json", "w"), indent=1)
          PY
          # why: --clobber replaces the existing asset -- the 422 fix
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

          # why: prune everything that isn't 0.1.0, this run's build, or
          # the manifest itself -- keeps the rolling release readable and
          # keeps the asset count far below the pagination cliff for good
          RELEASE_ID=$(gh api "repos/$REPO/releases/tags/$TAG" --jq .id)
          gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets" \
            --jq '.[] | "\(.id) \(.name)"' | while read -r id name; do
            [ "$name" = "latest.json" ] && continue
            v=$(echo "$name" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
            if [ "$v" != "0.1.0" ] && [ "$v" != "$VERSION" ]; then
              echo "pruning $name ($v)"
              gh api -X DELETE "repos/$REPO/releases/assets/$id"
            fi
          done
